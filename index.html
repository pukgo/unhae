<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>강호록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #fcfcfa; --card: #ffffff; --soft: #f3f2ee; --ink: #151515; --sub: #7b7a75;
    --line: #e4e2dc; --deco: #d6d3cb; --gold: #a38552; --red: #9b3d30;
    --head: 'Noto Sans KR', sans-serif;   /* 제목·한자 라벨용. 본문과 같은 글꼴을 쓴다 */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--paper); color: var(--ink); font: 15px/1.7 'Noto Sans KR', sans-serif; -webkit-font-smoothing: antialiased; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: none; }
  .serif { font-family: var(--head); }
  .mut { color: var(--sub); }

  /* 배경 장식: 구름 띠와 달 */
  .deco { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .deco svg { position: absolute; }
  .deco .tr { top: -20px; right: -40px; width: 520px; }
  .deco .bl { bottom: -30px; left: -60px; width: 460px; }
  #app, #toast, #gate { position: relative; z-index: 1; }

  .btn { border: 1px solid var(--ink); padding: 7px 18px; font-size: 13px; background: var(--card); transition: background .15s, color .15s; }
  .btn:hover { background: var(--ink); color: var(--paper); }
  .btn.fill { background: var(--ink); color: var(--paper); }
  .btn.fill:hover { background: #333; }
  .btn.ghost { border-color: var(--line); color: var(--sub); }
  .btn.ghost:hover { border-color: var(--ink); color: var(--paper); }
  .btn:disabled { opacity: .35; cursor: default; }
  .btn:disabled:hover { background: var(--card); color: var(--ink); }
  .link { font-size: 13px; color: var(--sub); }
  .link:hover { color: var(--ink); }
  .link:disabled { opacity: .4; cursor: default; }

  /* 입문 화면 */
  .gate { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
  .gate-box { width: min(440px, 100%); background: var(--card); border: 1px solid var(--ink); box-shadow: 0 0 0 6px var(--card), 0 0 0 7px var(--ink); padding: 32px 28px; }
  .gate-box .mk { width: 56px; height: 56px; margin-bottom: 16px; background: var(--ink); color: var(--paper); display: grid; place-items: center; font-family: var(--head); font-size: 19px; font-weight: 700; }
  .gate-box h1 { font-family: var(--head); font-size: 24px; font-weight: 700; margin-bottom: 6px; }
  .gate-box .stack { display: grid; gap: 14px; margin-top: 20px; }
  .gate-box .pick, .gate-box select, .gate-box textarea { width: 100%; min-width: 0; }
  .gate-box .err { font-size: 13px; color: var(--ink); text-decoration: underline; min-height: 20px; }

  /* 단말: 맨 위 소문 띠, 왼쪽 내 인물, 가운데 탭, 오른쪽 이곳, 아래 기록 */
  .ticker { position: sticky; top: 0; z-index: 6; display: flex; align-items: center; height: 36px; padding: 0 20px; background: var(--ink); color: var(--paper); font-size: 13px; }
  .ticker .clk { flex-shrink: 0; font-family: var(--head); letter-spacing: .06em; padding-right: 16px; margin-right: 16px; border-right: 1px solid rgba(255, 255, 255, .3); font-variant-numeric: tabular-nums; }
  .ticker .run { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; animation: fade .5s; }
  .ticker .run b { font-weight: 400; margin-right: 10px; opacity: .55; }
  .ticker .cnt { flex-shrink: 0; margin-left: 16px; opacity: .5; font-size: 12px; font-variant-numeric: tabular-nums; }
  .wrap {
    max-width: 1340px; margin: 0 auto; padding: 20px 24px 28px; display: grid; gap: 18px; align-items: start;
    grid-template-columns: 228px minmax(0, 1fr) 292px; grid-template-areas: 'me center here' 'log log log';
  }
  .pane { background: var(--card); border: 1px solid var(--ink); box-shadow: 0 0 0 3px var(--card), 0 0 0 4px var(--ink); min-width: 0; }
  .pane > .hd { background: var(--ink); color: var(--paper); text-align: center; font-family: var(--head); font-size: 12px; letter-spacing: .3em; padding: 3px 0; }
  .pane > .bd { padding: 16px 18px; }
  #mecol { grid-area: me; position: sticky; top: 58px; }
  #center { grid-area: center; }
  #aside { grid-area: here; position: sticky; top: 58px; max-height: calc(100vh - 78px); overflow: auto; }
  #log { grid-area: log; }
  nav.tabs { display: flex; border-bottom: 1px solid var(--ink); overflow-x: auto; scrollbar-width: none; }
  nav.tabs button { position: relative; flex: 1 0 auto; display: flex; align-items: baseline; justify-content: center; gap: 6px; padding: 9px 10px; font-size: 14px; color: var(--sub); white-space: nowrap; }
  nav.tabs button + button { border-left: 1px solid var(--line); }
  nav.tabs button i { font-style: normal; font-family: var(--head); font-size: 12px; opacity: .6; }
  nav.tabs button:hover { color: var(--ink); background: var(--soft); }
  nav.tabs button.on { background: var(--ink); color: var(--paper); }
  nav.tabs button.on i { opacity: 1; }
  nav.tabs .n { align-self: center; font-size: 10px; min-width: 16px; height: 16px; line-height: 16px; text-align: center; background: var(--ink); color: var(--paper); border-radius: 8px; padding: 0 4px; }
  nav.tabs button.on .n { background: var(--paper); color: var(--ink); }
  main { padding: 28px 32px 48px; min-width: 0; }

  .ph { position: relative; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-bottom: 16px; border-bottom: 1px solid var(--ink); }
  .ph::after { content: ''; position: absolute; left: 0; right: 0; bottom: -5px; border-bottom: 1px solid var(--line); }
  .ph h1 { font-family: var(--head); font-size: 26px; font-weight: 600; letter-spacing: .06em; }
  .tag { display: inline-block; font-size: 11px; border: 1px solid var(--ink); padding: 0 6px; line-height: 18px; vertical-align: 2px; white-space: nowrap; }
  .tag.npc, .tag.g1 { border-color: var(--gold); color: var(--gold); }
  .tag.g2 { background: var(--ink); color: var(--paper); }
  .empty { padding: 32px 0; text-align: center; font-size: 13px; color: var(--sub); }

  /* 객잔 */
  .av {
    width: 40px; height: 40px; border: 1px solid var(--ink); border-radius: 50%; background: var(--card); flex-shrink: 0; overflow: hidden;
    display: grid; place-items: center; font-family: var(--head); font-weight: 600; font-size: 16px;
  }
  .av.npc { border-color: var(--gold); color: var(--gold); }
  .av img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .compose { display: flex; gap: 14px; padding: 22px 0 18px; border-bottom: 1px solid var(--line); }
  .compose > div:last-child { flex: 1; }
  .compose textarea { width: 100%; border: none; background: none; resize: none; min-height: 56px; outline: none; }
  .compose .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; font-size: 12px; color: var(--sub); }
  .filters { display: flex; gap: 24px; border-bottom: 1px solid var(--line); font-size: 13px; flex-wrap: wrap; }
  .filters button { padding: 12px 0; color: var(--sub); border-bottom: 1px solid transparent; margin-bottom: -1px; }
  .filters button.on { color: var(--ink); border-bottom-color: var(--ink); }
  .post { display: flex; gap: 14px; padding: 18px 0; border-bottom: 1px solid var(--line); }
  .post > div:last-child { flex: 1; min-width: 0; }
  .post .h { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; font-size: 13px; }
  .post .h .nm { font-weight: 700; font-size: 15px; }
  .nm:hover { text-decoration: underline; text-underline-offset: 3px; }
  .post time { margin-left: auto; color: var(--sub); font-size: 12px; }
  .post p { margin: 4px 0 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .alias { font-family: var(--head); color: var(--gold); }
  .acts { display: flex; gap: 22px; font-size: 12px; color: var(--sub); }
  .acts button:hover { color: var(--ink); }
  .acts .on { color: var(--ink); font-weight: 700; }
  .post.sys { background: linear-gradient(90deg, var(--soft), transparent 70%); padding-left: 0; }
  .post.sys .lbl {
    width: 40px; flex-shrink: 0; display: grid; place-items: center; height: 40px;
    font-family: var(--head); font-size: 12px; letter-spacing: .04em; color: var(--paper); background: var(--ink);
  }
  .post.sys p { font-family: var(--head); margin-top: 8px; }
  .post.reply { padding-left: 54px; }
  /* 뒷사람(오너) 글: 캐릭터 글과 구분되도록 점선 테두리 */
  .post.ooc .av, .compose.ooc .av { border-style: dashed; color: var(--sub); font-size: 13px; }
  .post.ooc .owner-nm { font-size: 15px; }
  .back { margin: 0 0 14px; }

  /* 수련 */
  .realm { padding: 32px 0 0; display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; }
  .realm .lbl { font-size: 12px; color: var(--sub); letter-spacing: .12em; }
  .realm .big { font-family: var(--head); font-size: 48px; font-weight: 700; line-height: 1.15; }
  .realm .big small { font-size: 18px; font-weight: 400; margin-left: 10px; color: var(--sub); }
  .realm .qi { text-align: right; }
  .realm .qi b { font-family: var(--head); font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .meter { height: 3px; background: var(--line); margin: 18px 0 8px; }
  .meter i { display: block; height: 100%; background: var(--ink); }
  .under { display: flex; justify-content: space-between; font-size: 12px; color: var(--sub); font-variant-numeric: tabular-nums; }
  .ladder { display: grid; grid-template-columns: var(--cols); gap: 5px; margin-top: 18px; }
  .ladder .gap { border-left: 1px dashed var(--deco); margin-left: 3px; }
  .rung { text-align: center; }
  .rung .ticks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; margin-bottom: 6px; }
  .rung .ticks i { height: 8px; border: 1px solid var(--ink); }
  .rung .ticks i.f { background: var(--ink); }
  .rung span { font-family: var(--head); font-size: 12px; color: var(--sub); }
  .rung.cur span { color: var(--ink); font-weight: 700; }
  .rung.lock .ticks i { border-style: dashed; border-color: var(--deco); }
  .rung.lock span { color: var(--deco); }
  .path { list-style: none; display: grid; grid-template-columns: repeat(var(--n, 8), 1fr); border-top: 1px solid var(--line); }
  .path li { position: relative; padding: 14px 4px 0; text-align: center; }
  .path li i { display: block; width: 9px; height: 9px; margin: -19px auto 10px; border: 1px solid var(--ink); background: var(--paper); transform: rotate(45deg); }
  .path li.f i { background: var(--ink); }
  .path li.nx i { background: var(--gold); border-color: var(--gold); }
  .path span { display: block; font-family: var(--head); font-size: 13px; line-height: 1.35; word-break: keep-all; }
  .path li:not(.f):not(.nx) span { color: var(--sub); }
  .path li.nx span { font-weight: 700; }
  .path small { display: block; font-size: 11px; color: var(--sub); margin-top: 2px; }
  .bt { margin-top: 24px; border: 1px solid var(--ink); background: var(--card); padding: 18px 20px; display: flex; justify-content: space-between; align-items: center; gap: 16px; }
  .bt b { font-family: var(--head); font-size: 17px; }
  .bt p { font-size: 13px; color: var(--sub); }
  .nums { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin-top: 28px; }
  .nums div { padding: 16px 0; }
  .nums div + div { padding-left: 20px; border-left: 1px solid var(--line); }
  .nums small { display: block; font-size: 12px; color: var(--sub); }
  .nums b { font-size: 20px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .stats { border-top: 1px solid var(--ink); }
  .stat { display: grid; grid-template-columns: 42px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .stat .hj { width: 40px; height: 40px; border: 1px solid var(--ink); display: grid; place-items: center; font-family: var(--head); font-size: 18px; }
  .stat b { font-family: var(--head); font-size: 16px; font-weight: 600; }
  .stat b .v { font-size: 22px; margin-left: 8px; font-variant-numeric: tabular-nums; }
  .stat b .plus { font-size: 13px; margin-left: 6px; color: var(--gold); }
  .stat small { display: block; font-size: 12px; color: var(--sub); }
  .stat .side { display: flex; align-items: center; gap: 10px; }
  .step { display: flex; align-items: center; border: 1px solid var(--ink); }
  .step button { width: 30px; height: 30px; font-size: 16px; line-height: 1; }
  .step button:disabled { color: var(--deco); cursor: default; }
  .step input { width: 46px; height: 30px; border: none; border-left: 1px solid var(--line); border-right: 1px solid var(--line); background: none; text-align: center; font: inherit; font-size: 14px; font-variant-numeric: tabular-nums; outline: none; -moz-appearance: textfield; appearance: textfield; }
  .step input:focus { background: var(--soft); }
  .step input::-webkit-inner-spin-button, .step input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .dxp { display: inline-flex; gap: 3px; margin-left: 6px; vertical-align: 1px; }
  .dxp i { width: 7px; height: 7px; border: 1px solid var(--ink); }
  .dxp i.f { background: var(--ink); }
  .sec { margin-top: 44px; }
  .sec > h2 { font-family: var(--head); font-size: 17px; font-weight: 600; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .sec > .desc { font-size: 13px; color: var(--sub); margin: -6px 0 14px; }
  .opts { display: grid; grid-template-columns: repeat(var(--n, 3), 1fr); border: 1px solid var(--ink); background: var(--card); }
  .opt { padding: 20px; text-align: left; display: flex; flex-direction: column; gap: 2px; transition: background .15s, color .15s; }
  .opt + .opt { border-left: 1px solid var(--ink); }
  .opt b { font-family: var(--head); font-size: 22px; font-weight: 600; margin-bottom: 6px; }
  .opt small { font-size: 12px; color: var(--sub); }
  .opt:hover { background: var(--ink); color: var(--paper); }
  .opt:hover small { color: inherit; opacity: .7; }
  .opt:disabled { cursor: default; }
  .opt:disabled > * { opacity: .45; }
  .opt:disabled:hover { background: var(--card); color: var(--ink); }
  .count { border: 1px solid var(--ink); background: var(--card); padding: 30px 20px; text-align: center; }
  .count .big { font-family: var(--head); font-size: 40px; letter-spacing: .06em; font-variant-numeric: tabular-nums; margin: 4px 0 10px; }

  /* 비무 */
  .card { border: 1px solid var(--ink); background: var(--card); padding: 18px 20px; }
  .card + .card { margin-top: 12px; }
  .card .top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .stances { display: grid; grid-template-columns: repeat(3, 1fr); margin: 16px 0; border: 1px solid var(--ink); }
  .stances button { padding: 12px 10px; text-align: left; display: flex; flex-direction: column; gap: 2px; transition: background .15s, color .15s; }
  .stances button + button { border-left: 1px solid var(--ink); }
  .stances b { font-family: var(--head); font-size: 16px; font-weight: 600; }
  .stances b span { margin-right: 6px; }
  .stances small { font-size: 11px; color: var(--sub); line-height: 1.5; }
  .stances button:hover { background: var(--soft); }
  .stances button.on { background: var(--ink); color: var(--paper); }
  .stances button.on small { color: inherit; opacity: .75; }
  .cmp { display: grid; grid-template-columns: minmax(0, 1fr) repeat(4, auto); gap: 2px 16px; font-size: 13px; margin-top: 14px; font-variant-numeric: tabular-nums; }
  .cmp .h { color: var(--sub); font-size: 12px; }
  .cmp .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .flog { list-style: none; text-align: left; font-size: 13px; line-height: 1.6; max-height: 260px; overflow: auto; margin-top: 16px; padding: 10px 12px; background: var(--paper); border: 1px solid var(--line); }
  .modal .flog li { display: block; padding: 2px 0; border: none; font-size: 13px; }
  .flog li:last-child { font-weight: 600; }
  .route { list-style: none; margin: 12px 0 2px; font-size: 13px; }
  .route li { position: relative; display: flex; justify-content: space-between; gap: 8px; padding: 2px 0 2px 18px; color: var(--sub); }
  .route li::before { content: ''; position: absolute; left: 3px; top: 9px; width: 7px; height: 7px; border: 1px solid var(--ink); background: var(--card); transform: rotate(45deg); }
  .route li + li::after { content: ''; position: absolute; left: 6.5px; top: -6px; height: 12px; border-left: 1px solid var(--line); }
  .route li.f::before { background: var(--ink); }
  .route li.nx { color: var(--ink); font-weight: 600; }
  .route small { font-variant-numeric: tabular-nums; }
  .res.click { cursor: pointer; }
  .res.click:hover { background: var(--soft); }
  .res .how { font-size: 12px; color: var(--sub); text-align: center; white-space: nowrap; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .pick { border: none; border-bottom: 1px solid var(--line); background: none; padding: 4px 0; outline: none; min-width: 200px; }
  .rule { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 28px; align-items: center; }
  .rule svg { width: 100%; height: auto; }
  .rule dl { display: grid; gap: 14px; }
  .rule dt { font-family: var(--head); font-weight: 600; }
  .rule dt span { font-size: 22px; margin-right: 8px; }
  .rule dd { font-size: 13px; color: var(--sub); }
  .note { font-size: 13px; color: var(--sub); border-left: 2px solid var(--line); padding-left: 14px; margin-top: 18px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { font-weight: 500; color: var(--sub); text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--ink); white-space: nowrap; }
  td { padding: 10px 8px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; vertical-align: top; }
  td.w { font-family: var(--head); font-size: 16px; font-weight: 600; white-space: nowrap; }
  tr.mine td { background: var(--soft); }
  .res { display: grid; grid-template-columns: 1fr auto 1fr; gap: 16px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .res > div:last-child { text-align: right; }
  .res .win { font-family: var(--head); font-size: 12px; margin: 0 6px; border: 1px solid var(--ink); padding: 0 4px; }
  .dots { display: flex; gap: 5px; }
  .dot { width: 9px; height: 9px; border: 1px solid var(--ink); border-radius: 50%; }
  .dot.l { background: var(--ink); }
  .dot.d { border-color: var(--deco); background: var(--deco); }

  /* 서신 */
  .mail { display: grid; grid-template-columns: 200px minmax(0, 1fr); border: 1px solid var(--ink); margin-top: 24px; background: var(--card); }
  .threads { border-right: 1px solid var(--line); }
  .threads button { display: block; width: 100%; text-align: left; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .threads button.on { background: var(--soft); }
  .threads b { display: block; font-size: 14px; font-weight: 500; }
  .threads small { display: block; font-size: 12px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .threads .unread b::after { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--ink); margin-left: 8px; vertical-align: middle; }
  .conv { display: flex; flex-direction: column; min-height: 460px; }
  .conv .hd { padding: 14px 20px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .conv .hd b { font-family: var(--head); font-weight: 600; }
  .msgs { flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 16px; overflow: auto; max-height: 420px; }
  .msg { max-width: 80%; }
  .msg .body { border: 1px solid var(--line); background: var(--paper); padding: 10px 14px; white-space: pre-wrap; }
  .msg.me { align-self: flex-end; }
  .msg.me .body { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .msg.fly .body { background: var(--card); color: var(--sub); border: 1px dashed var(--ink); }
  .msg small { display: block; font-size: 11px; color: var(--sub); margin-top: 4px; }
  .msg.me small { text-align: right; }
  .conv .in { border-top: 1px solid var(--line); display: flex; align-items: flex-end; padding: 10px 12px 10px 20px; gap: 12px; }
  .conv textarea { flex: 1; border: none; background: none; resize: none; outline: none; height: 48px; }

  /* 인물첩 */
  .search { width: 100%; margin: 24px 0 0; border: none; border-bottom: 1px solid var(--line); background: none; padding: 8px 0; outline: none; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .pc { display: flex; gap: 14px; padding: 18px 0; border-bottom: 1px solid var(--line); text-align: left; }
  .grid .pc:nth-child(odd) { padding-right: 20px; border-right: 1px solid var(--line); }
  .grid .pc:nth-child(even) { padding-left: 20px; }
  .pc > div:last-child { min-width: 0; }
  .pc .meta { font-size: 12px; color: var(--sub); }

  const OC_LIGHT = 'id, owner, npc, name, title, weapon, lv, qi, fame, silver, insight, path, w, l, d, hours, retreat_hours, retreat_until, life, arms, equip, loc, dest, arrive_at, act, atk, def, agi, route, created_at, updated_at';
  // 화면이 들고 있는 인물 객체를 바꾸지 않고 내용만 새로 채운다. 프로필 없이 받은 줄이면 들고 있던 프로필을 그대로 둔다
  function mergeOc(r) {
    const o = by(r.id);
    if (!('profile' in r)) r = { ...r, profile: o ? pickKeys(o, PROFILE_KEYS) : {} };
    const n = fromRow(r);
    if (!o) { ocs.push(n); return; }
    Object.keys(o).forEach(k => delete o[k]);
    Object.assign(o, n);
  }
  // 새 글을 끼워 넣는다. 내가 방금 쓴 글(임시 id)이 돌아오면 그 글에 id만 붙인다
  function addPost(p) {
    const list = allLoaded();
    if (list.some(x => x.id === p.id)) return;
    const tmp = list.find(x => String(x.id).startsWith('tmp') && x.oc === p.oc && x.body === p.body && x.kind === p.kind && (x.reply_to ?? null) === (p.reply_to ?? null));
    if (tmp) { tmp.id = p.id; tmp.t = p.t; return; }
    if (p.reply_to) { if (!replies.has(p.reply_to)) replies.set(p.reply_to, []); replies.get(p.reply_to).push(p); }
    else posts.unshift(p);
  }
  async function loadReplies(ids) {
    if (!ids.length) return;
    const rows = await q(db.from('posts').select(POST_COLS).in('reply_to', ids).order('id'));
    rows.map(toPost).forEach(addPost);
  }
  // 공감은 불러온 글 가운데 가장 오래된 글부터 끝까지만 받는다
  async function loadReactions() {
    const ids = allLoaded().map(p => p.id).filter(id => typeof id === 'number');
    if (!ids.length) return;
    const rows = await q(db.from('reactions').select('post_id, oc_id').gte('post_id', Math.min(...ids)));
    const likes = new Map();
    rows.forEach(r => { if (!likes.has(r.post_id)) likes.set(r.post_id, []); likes.get(r.post_id).push(r.oc_id); });
    allLoaded().forEach(p => { if (typeof p.id === 'number') p.likes = likes.get(p.id) || []; });
  }
  function recount() {
    const ids = allLoaded().map(p => p.id).filter(id => typeof id === 'number');
    maxPostId = Math.max(maxPostId, ...ids, 0);
    const top = posts.map(p => p.id).filter(id => typeof id === 'number');
    minTopId = top.length ? Math.min(...top) : null;
    // 수정 확인 기준 시각: 불러온 글 가운데 가장 최근의 작성·수정 시각 (서버 시계 기준)
    allLoaded().filter(p => typeof p.id === 'number').forEach(p => { const t = p.edited && p.edited > p.t ? p.edited : p.t; if (t > syncEdit) syncEdit = t; });
  }
  // skipOcs: 30초 새로 받기에서는 인물을 건너뛴다 (10초마다 가볍게 받기가 이미 받는다)
  async function loadAll(full = true, skipOcs = false) {
    // 설정: 저장 시각이 바뀌었을 때만 내용을 받는다
    const st = await q(db.from('settings').select('updated_at').eq('id', 1).maybeSingle());
    if (full || st?.updated_at !== settingsAt) {
      const s = await q(db.from('settings').select('data, updated_at').eq('id', 1).maybeSingle());
      settingsAt = s?.updated_at; settingsFound = applySettings(s?.data);
    }
    // 인물: 전체를 받을 때는 사라진 인물도 정리한다
    let oq = db.from('ocs').select(full ? '*' : OC_LIGHT).order('updated_at');
    if (!full && syncOc) oq = oq.gt('updated_at', syncOc);
    const rows = full || !skipOcs ? await q(oq) : [];
    if (full) { const keep = new Set(rows.map(r => r.id)); ocs = ocs.filter(o => keep.has(o.id)); }
    rows.forEach(r => { mergeOc(r); if (r.updated_at > syncOc) syncOc = r.updated_at; });
    ocs.sort((a, b) => (a.created_at < b.created_at ? -1 : 1));
    // 객잔 글: 전체를 받을 때는 최근 PAGE개와 그 답글, 그 사이에는 새로 생긴 글만
    if (full) {
      const top = await q(db.from('posts').select(POST_COLS).is('reply_to', null).order('id', { ascending: false }).limit(PAGE));
      const keepTmp = allLoaded().filter(p => String(p.id).startsWith('tmp'));
      posts = []; replies = new Map(); maxPostId = 0;
      top.reverse().map(toPost).forEach(addPost);
      morePosts = top.length === PAGE;
      await loadReplies(posts.map(p => p.id));
      keepTmp.forEach(addPost);
    } else {
      const fresh = await q(db.from('posts').select(POST_COLS).gt('id', maxPostId).order('id'));
      fresh.map(toPost).forEach(addPost);
      // 그 사이 고쳐진 글은 내용만 바꿔 넣는다
      if (syncEdit) {
        const edited = await q(db.from('posts').select('id, body, edited_at').gt('edited_at', syncEdit));
        edited.forEach(r => {
          const p = allLoaded().find(x => x.id === r.id);
          if (p && editingPost !== p.id) { p.body = r.body; p.edited = r.edited_at; }
          if (r.edited_at > syncEdit) syncEdit = r.edited_at;   // 불러오지 않은 옛 글이 고쳐져도 기준 시각은 넘긴다
        });
      }
    }
    recount();
    // 공감은 객잔을 볼 때와 전체 새로 받기 때만
    if (full || page === 'timeline' || page === 'thread') await loadReactions();
  }
  // 객잔 맨 아래 '이전 글 더 보기'
  async function loadMore() {
    if (minTopId == null) return;
    const older = await q(db.from('posts').select(POST_COLS).is('reply_to', null).lt('id', minTopId).order('id', { ascending: false }).limit(PAGE));
    const ps = older.map(toPost);
    posts.push(...ps);
    morePosts = older.length === PAGE;
    await loadReplies(ps.map(p => p.id));
    recount();
    await loadReactions();
    render();
  }
  // 활동 인물 기준: 서신, 비무, 받은 선물
  // 서신은 처음(과 전체 새로 받기 때)에만 통째로 받고, 그 사이에는 바뀐 것만 받는다:
  // 보낸 서신은 id로, 받은 서신은 도착 시각으로(도착 전에는 보이지 않으므로), 상대가 읽은 표시는 읽은 시각으로
  const letterRows = new Map();
  let letterFor = null, letterOut = 0, letterIn = '', letterRead = '';
  const LETTER_COLS = 'id, from_oc, to_oc, body, created_at, arrive_at, read_at';
  async function loadLetters(full) {
    let rows;
    if (full || letterFor !== me) {
      rows = await q(db.from('letters').select(LETTER_COLS).or(`from_oc.eq.${me},to_oc.eq.${me}`).order('created_at', { ascending: false }).limit(300));
      letterRows.clear(); letterFor = me; letterOut = 0; letterIn = ''; letterRead = '';
    } else {
      const [o, i, r] = await Promise.all([
        q(db.from('letters').select(LETTER_COLS).eq('from_oc', me).gt('id', letterOut)),
        q(db.from('letters').select(LETTER_COLS).eq('to_oc', me).gt('arrive_at', letterIn || '1970-01-01')),
        letterRead ? q(db.from('letters').select('id, read_at').eq('from_oc', me).gt('read_at', letterRead)) : [],
      ]);
      rows = [...o, ...i];
      r.forEach(x => { const l = letterRows.get(x.id); if (l) l.read_at = x.read_at; if (x.read_at > letterRead) letterRead = x.read_at; });
    }
    rows.forEach(r => {
      letterRows.set(r.id, r);
      if (r.from_oc === me && r.id > letterOut) letterOut = r.id;
      if (r.to_oc === me && r.arrive_at > letterIn) letterIn = r.arrive_at;
      if (r.from_oc === me && r.read_at && r.read_at > letterRead) letterRead = r.read_at;
    });
    if (!letterRead) letterRead = new Date(Date.now() - 60e3).toISOString();
    // 오래된 서신은 300통까지만 들고 있는다
    if (letterRows.size > 300) [...letterRows.keys()].sort((a, b) => a - b).slice(0, letterRows.size - 300).forEach(k => letterRows.delete(k));
    return [...letterRows.values()].sort((a, b) => (a.created_at < b.created_at ? -1 : 1));
  }
  let resultsAt = 0;
  async function loadMine(full = false) {
    if (!me) return;
    // 지난 비무 목록은 처음, 비무 탭을 볼 때, 전체 새로 받기 때만
    const wantResults = full || page === 'duel' || !resultsAt;
    const [ls, dIn, dOut, done, pend, gifts] = await Promise.all([
      loadLetters(full),
      q(db.from('duels').select('id, challenger, defender, created_at').eq('defender', me).eq('status', 'pending').order('created_at')),
      q(db.from('duels').select('id, challenger, defender, created_at').eq('challenger', me).eq('status', 'pending').order('created_at')),
      wantResults ? q(db.rpc('duel_recent')) : null,
      q(db.from('duels').select('*').eq('status', 'done').or(`and(challenger.eq.${me},applied_a.eq.false),and(defender.eq.${me},applied_b.eq.false)`)),
      q(db.from('gifts').select('*').eq('to_oc', me).eq('seen', false).order('created_at')),
    ]);
    const byOther = new Map(); unread.clear();
    for (const r of ls) {
      const out = r.from_oc === me, other = out ? r.to_oc : r.from_oc;
      if (!byOther.has(other)) byOther.set(other, []);
      byOther.get(other).push({ id: r.id, me: out, body: r.body, t: r.created_at, fly: out && Date.parse(r.arrive_at) > Date.now() ? hm(r.arrive_at) : null, read: !!r.read_at });
      if (!out && !r.read_at) unread.add(other);
    }
    letters.clear();
    [...byOther].sort((a, b) => Date.parse(b[1].at(-1).t) - Date.parse(a[1].at(-1).t)).forEach(([k, v]) => letters.set(k, v));
    duelsIn = dIn.map(d => ({ id: d.id, from: d.challenger, t: d.created_at }));
    duelsOut = dOut.map(d => ({ id: d.id, to: d.defender, t: d.created_at }));
    if (done) resultsAt = Date.now();
    // 목록에는 승패 · 합 수 · 자세만 온다. 대결 기록은 누를 때 그 한 판만 받는다 (fightLog)
    if (done) results = done.map(d => ({ id: d.id, a: d.a, b: d.b, win: d.win, t: d.t, r: (d.old || []).map(x => x.r),
      f: d.rounds ? { rounds: d.rounds, ko: d.ko } : null, st: d.stance || {}, paid: d.rewarded !== false }));
    await applyPending(pend, gifts);
    // 기록·인사는 10초마다 가볍게 받기가 맡는다. 처음이거나 인물·장소가 바뀌었을 때만 여기서 받는다
    if (full || `${me}|${hereOf(by(me))}` !== logKey) await loadPlace(full);
  }
  // 이곳: 내 기록과 지금 장소의 기록, 받은 인사(하루치), 인연
  // 기록과 받은 인사도 처음(인물·장소가 바뀌었을 때)만 통째로 받고, 그 사이에는 새로 생긴 것만 받는다.
  // 기록은 생긴 시각으로 센다: 도착 기록은 도착 시각으로 미리 들어가 있어, 그 시각이 지나야 보이기 때문이다
  const toasted = new Set(), logMap = new Map();
  let logKey = '', logMe = '', logPlace = '', greetRows = [], greetMax = 0, bondsAt = 0;
  const LOG_COLS = 'id, oc_id, kind, place, body, created_at';
  async function loadPlace(full = false, withBonds = false) {
    const o = by(me);
    if (!o) return;
    const here = hereOf(o), now = Date.now(), key = `${me}|${here}`, fresh = full || key !== logKey;
    const since = t => t || '1970-01-01';
    const [mineL, placeL, gs, bs] = await Promise.all([
      fresh ? q(db.from('logs').select(LOG_COLS).eq('oc_id', me).eq('kind', 'me').order('created_at', { ascending: false }).limit(40))
        : q(db.from('logs').select(LOG_COLS).eq('oc_id', me).eq('kind', 'me').gt('created_at', since(logMe))),
      !here ? [] : fresh ? q(db.from('logs').select(LOG_COLS).eq('kind', 'place').eq('place', here).order('created_at', { ascending: false }).limit(30))
        : q(db.from('logs').select(LOG_COLS).eq('kind', 'place').eq('place', here).gt('created_at', since(logPlace))),
      fresh || !greetMax ? q(db.from('greets').select('*').eq('to_oc', me).gt('created_at', new Date(now - 864e5).toISOString()).order('id'))
        : q(db.from('greets').select('*').eq('to_oc', me).gt('id', greetMax).order('id')),
      fresh || withBonds || now - bondsAt > 60e3 ? q(db.from('bonds').select('*').or(`a.eq.${me},b.eq.${me}`)) : null,
    ]);
    if (fresh) { logMap.clear(); logKey = key; logMe = ''; logPlace = ''; greetRows = []; }
    // 다음에 받을 기준 시각: 지금까지 보이는(이미 지난) 기록 가운데 가장 늦은 시각
    mineL.forEach(x => { logMap.set(x.id, x); if (Date.parse(x.created_at) <= now && x.created_at > logMe) logMe = x.created_at; });
    placeL.forEach(x => { if (x.oc_id !== me) logMap.set(x.id, x); if (x.created_at > logPlace) logPlace = x.created_at; });
    logs = [...logMap.values()].filter(x => Date.parse(x.created_at) <= now).sort((a, b) => (a.created_at < b.created_at ? 1 : -1)).slice(0, 60);
    if (logMap.size > 120) [...logMap.values()].sort((a, b) => (a.created_at < b.created_at ? 1 : -1)).slice(120).forEach(x => logMap.delete(x.id));
    gs.forEach(g => { if (!greetRows.some(x => x.id === g.id)) greetRows.push(g); if (g.id > greetMax) greetMax = g.id; });
    greetRows = greetRows.filter(g => now - Date.parse(g.created_at) < 864e5);
    greetsIn = greetRows.filter(g => g.id > +(lsGet('ghr-greet-' + me) || 0));
    greetsIn.forEach(g => {
      if (toasted.has(g.id)) return;
      toasted.add(g.id);
      if (started && now - Date.parse(g.created_at) < 60e3) toast(g.reply_to ? `${by(g.from_oc)?.name || '누군가'}의 답례 · ${greetWord(g.kind)}` : `${by(g.from_oc)?.name || '누군가'}의 인사 · ${GREETS.find(x => x[0] === g.kind)?.[1] || g.kind}`);
    });
    if (bs) { bonds = new Map(bs.map(b => [b.a === me ? b.b : b.a, b.score])); bondsAt = now; }
  }
  let rumorsReady = false;
  async function loadRumors() { rumors = await q(db.rpc('rumor_feed', { p_oc: me })); rumorsAt = Date.now(); rumorsReady = true; }
  // 비무 결과와 받은 선물을 팝업으로 알린다. 수치는 서버가 이미 반영해 두었다
  async function applyPending(duels, gifts) {
    const o = by(me);
    if (!canAct(o) || (!duels.length && !gifts.length)) return;
    // 창이 둘 열려 있어도 한 번만 뜨도록, '봤음' 표시를 먼저 차지한 것만 알린다
    const got = await q(db.rpc('mark_seen', { p_oc: me, p_duels: duels.map(d => d.id), p_gifts: gifts.map(g => g.id) }));
    duels = duels.filter(d => got.duels.includes(d.id));
    gifts = gifts.filter(g => got.gifts.includes(g.id));
    if (!duels.length && !gifts.length) return;
    const r = await q(db.from('ocs').select('*').eq('id', o.id).maybeSingle());
    if (r) mergeOc(r);
    const pops = [];
    for (const d of duels) {
      const side = d.challenger === me ? 'a' : 'b', dl = d.result.delta[side];
      const other = by(side === 'a' ? d.defender : d.challenger), title = !d.result.winner ? '무승부' : d.result.winner === me ? '승리' : '패배';
      if (d.result.fight) pops.push(duelPop(d.result, side, other, title));
      else pops.push({   // 005 전에 끝난 초식 판
        mark: '武', kicker: '비무 결과', title, story: '세 합을 겨뤘습니다.',
        lines: [['상대', other?.name || '?'], ['합', (d.result.rounds || []).map(x => (side === 'a' ? x.r : { l: 'r', r: 'l', d: 'd' }[x.r])).map(x => ({ l: '이김', r: '짐', d: '비김' }[x])).join(' · ')],
          ['명성', `+${dl.fame || 0}`], ['깨달음', `+${dl.insight || 0}`]],
      });
    }
    for (const g of gifts) {
      let arm = null, what;
      if (g.kind === 'item') what = `${g.name} ${g.qty}개`;
      else if (g.kind === 'arm') { arm = g.arm; what = `병기 「${arm.name}」`; }
      else what = `은자 ${fmt(g.qty)}`;
      pops.push({ mark: '禮', kicker: `${g.from_name}의 선물`, title: what, story: g.msg, arm });
    }
    pops.forEach(popup);
  }

  // ── 공통 ──────────────────────────────────
  const $ = s => document.querySelector(s);
  const h = (tag, props, ...kids) => {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(props || {})) {
      if (v == null || v === false) continue;
      if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else if (k === 'class') el.className = v;
      else el.setAttribute(k, v === true ? '' : v);
    }
    for (const c of kids.flat(Infinity)) if (c != null && c !== false) el.append(c);
    return el;
  };
  const fmt = n => Number(n || 0).toLocaleString('ko-KR');
  // 앞말의 마지막 글자에 받침이 있으면 withB, 없으면 noB (예: 철권이라는 / 청풍검이라는 / 고목선사라는)
  const josa = (word, withB, noB) => {
    const c = String(word).trim().slice(-1).charCodeAt(0);
    return c >= 0xAC00 && c <= 0xD7A3 && (c - 0xAC00) % 28 ? withB : noB;
  };
  const pad = n => String(n).padStart(2, '0');
  const hm = t => { const d = new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  const ago = t => {
    const s = (Date.now() - Date.parse(t)) / 1000, d = new Date(t);
    return s < 60 ? '방금' : s < 3600 ? `${Math.floor(s / 60)}분 전` : s < 86400 ? `${Math.floor(s / 3600)}시간 전` : `${d.getMonth() + 1}.${d.getDate()}`;
  };
  const ph = t => h('div', { class: 'ph' }, h('h1', {}, t));
  const sec = (title, desc, ...kids) => h('div', { class: 'sec' }, h('h2', {}, title), desc ? h('p', { class: 'desc' }, desc) : null, kids);
  const empty = t => h('p', { class: 'empty' }, t);
  let toastT;
  const toast = m => { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2800); };
  const name = o => o ? h('button', { class: 'nm', onclick: () => go('profile', o.id) }, o.name) : h('span', { class: 'mut' }, '[사라진 인물]');
  const av = o => h('div', { class: 'av' + (o?.npc ? ' npc' : '') }, o?.seal ? h('img', { src: o.seal, alt: '' }) : (o ? [...o.name][0] : '?'));
  const npcTag = o => o?.npc ? h('span', { class: 'tag npc' }, 'NPC') : null;
  const gradeTag = g => h('span', { class: 'tag g' + gradeIdx(g) }, g);
  const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };

  // 버튼을 두 번 눌러 같은 일이 두 번 처리되지 않도록 한 번에 하나씩만 처리한다.
  // 서버가 거절하면(다른 기기에서 이미 했거나 조건이 바뀐 경우) 알림을 띄우고 화면을 최신으로 맞춘다
  let busy = false;
  const act = fn => async (...a) => {
    if (busy) return;
    busy = true;
    try { await fn(...a); } catch (e) {
      console.error(e);
      if (started && e?.code === 'P0001') { const r = await db.from('ocs').select('*').eq('id', me).maybeSingle(); if (r.data) mergeOc(r.data); render(); }
    } finally { busy = false; }
  };

  // 객잔 글은 바로 화면에 보이고, 저장이 끝나면 id를 받아 둔다
  function newPost(kind, oc, body, replyTo = null) {
    const p = { id: 'tmp-' + Math.random(), kind, oc, body, t: new Date().toISOString(), reply_to: replyTo, likes: [] };
    if (replyTo) { if (!replies.has(replyTo)) replies.set(replyTo, []); replies.get(replyTo).push(p); } else posts.unshift(p);
    // 저장이 끝나면 다시 그려 수정·삭제 버튼이 바로 나오게 한다
    q(db.from('posts').insert({ oc_id: oc, kind, body, reply_to: replyTo }).select('id, created_at').single())
      .then(r => { p.id = r.id; p.t = r.created_at; if (started && !typing()) render(); }).catch(() => {});
    return p;
  }

  // ════════════════════════════════════════════
  // 시작

  function gate(title, kids) {
    $('#app').style.display = 'none';

  }
  async function boot() {
    if (!SUPABASE_URL || !SUPABASE_ANON_KEY) return gate('연결 설정이 필요합니다', h('p', { class: 'mut' }, 'index.html 위쪽의 SUPABASE_URL과 SUPABASE_ANON_KEY를 채워 주세요.'));
    db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const { data: { session } } = await db.auth.getSession();
    session ? start(session.user) : showAuth();
  }
  // Supabase 로그인 오류를 한국어로
  const AUTH_ERR = [
    [/Invalid login credentials/i, '이메일이나 비밀번호가 맞지 않습니다.'],
    [/already registered|already been registered/i, '이미 가입한 이메일입니다. 로그인을 눌러 주세요.'],
    [/Password should be at least/i, '비밀번호는 6자 이상이어야 합니다.'],
    [/valid email|invalid format|Unable to validate email/i, '이메일 주소를 확인해 주세요.'],
    [/Email not confirmed/i, '메일 확인이 아직 끝나지 않았습니다. 받은 메일의 링크를 눌러 주세요.'],
    [/rate limit|too many requests|For security purposes/i, '잠시 뒤에 다시 시도해 주세요.'],
    [/missing email|missing password|anonymous/i, '이메일과 비밀번호를 모두 적어 주세요.'],
    [/signups? (are )?not allowed|signup(s)? (is |are )?disabled/i, '지금은 새로 가입할 수 없습니다. 운영자에게 문의해 주세요.'],
    [/fetch|network/i, '인터넷 연결을 확인해 주세요.'],
  ];
  function showAuth() {
    const email = h('input', { class: 'pick', type: 'email', placeholder: '이메일', autocomplete: 'email' });
    const pw = h('input', { class: 'pick', type: 'password', placeholder: '비밀번호 (6자 이상)', autocomplete: 'current-password' });
    const err = h('p', { class: 'err' });
    const submit = act(async signup => {
      err.textContent = '';
      const cred = { email: email.value.trim(), password: pw.value };
      const { data, error } = signup ? await db.auth.signUp(cred) : await db.auth.signInWithPassword(cred);
      if (error) return void (err.textContent = AUTH_ERR.find(([re]) => re.test(error.message))?.[1] || error.message);
      if (!data.session) return void (err.textContent = '확인 메일을 보냈습니다. 메일의 링크를 누른 뒤 로그인해 주세요.');
      await start(data.session.user);
    });
    pw.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) submit(false); });
    gate('강호에 들어서기', [h('p', { class: 'mut', style: 'font-size:13px' }, '처음이라면 이메일과 비밀번호를 적고 가입을 눌러 주세요.'),
      h('div', { class: 'stack' }, email, pw, h('div', { class: 'row' }, h('button', { class: 'btn fill', onclick: () => submit(false) }, '로그인'), h('button', { class: 'btn', onclick: () => submit(true) }, '가입')), err)]);
  }
  async function start(u) {
    user = u;
    const prof = await q(db.from('profiles').select('is_admin').eq('id', user.id).maybeSingle());
    isAdmin = !!prof?.is_admin;
    await loadAll();
    // 처음 운영자가 들어오면 기본 설정을, 새 판에서 생긴 설정이 빠져 있으면 그 기본값을 채워 저장한다
    if (isAdmin && (!settingsFound || cfgMissing)) { await saveSettings(); cfgMissing = false; }
    if (!mine().length) return createOc();
    const saved = lsGet('ghr-active');
    me = mine().some(o => o.id === saved) ? saved : (mine().find(o => !o.npc) || mine()[0]).id;
    await loadMine(true);
    $('#gate').replaceChildren(); $('#app').style.display = '';
    lastSync = Date.now();
    render();
    if (!lsGet('ghr-tour')) setTimeout(startTour, 600);   // 처음 들어온 사람에게 한 번
    if (!started) {
      started = true;
      setInterval(refresh, 30000); setInterval(tickClock, 1000); setInterval(lightRefresh, 10000);
      setInterval(() => { tickI++; renderTicker(); }, 6000);
      loadWeather(); setInterval(loadWeather, 30 * 60e3);
      // 다른 탭이나 앱을 보다가 돌아오면 바로 한 번 새로 불러온다
      document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - lastSync > 30e3) refresh(true); });
    }
  }
  function createOc() {
    const nm = h('input', { class: 'pick', placeholder: '이름 (20자까지)', maxlength: 20 });
    const aff = h('input', { class: 'pick', placeholder: '소속 (없으면 비워 두기)', maxlength: 20 });

    const wp = h('select', { class: 'pick', onchange: () => { desc.textContent = traitDesc(WEAPONS[wp.value]) ? `${WEAPONS[wp.value].trait} · ${traitDesc(WEAPONS[wp.value])}` : ''; } },
      h('option', { value: '' }, '무기 고르기'), Object.keys(WEAPONS).map(w => h('option', { value: w }, `${w} · ${WEAPONS[w].style}`)));
    const bio = h('textarea', { class: 'field', placeholder: '한두 줄 소개 (나중에 프로필에서 자세히 적을 수 있습니다)', maxlength: 500 });

    const save = act(async () => {
      err.textContent = '';
      if (!nm.value.trim()) return void (err.textContent = '이름을 적어 주세요.');
      if (!wp.value) return void (err.textContent = '무기를 골라 주세요.');
      const row = { name: nm.value.trim(), weapon: wp.value, npc: !!npc?.checked,
        profile: { aff: aff.value.trim() || '무소속', bio: bio.value.trim() }, life: { st: SET.stMax, st_at: Date.now() / 1000, bag: {} } };
      const r = await q(db.from('ocs').insert(row).select().single()).catch(() => null);
      if (!r) return;
      lsSet('ghr-active', r.id);
      await start(user);
    });
    gate('강호에 나설 인물', [h('p', { class: 'mut', style: 'font-size:13px' }, '인물은 한 사람에 하나입니다. 무기는 지금 고르면 나중에 바꿀 수 없습니다.'),
      h('div', { class: 'stack' }, nm, aff, wp, desc, bio,
        npc ? h('label', { class: 'chk' }, npc, '운영자 · 이 인물을 NPC로 만들기') : null,
        h('div', { class: 'row' }, h('button', { class: 'btn fill', onclick: save }, '인물 만들기'), h('button', { class: 'link', onclick: () => db.auth.signOut().then(() => location.reload()) }, '로그아웃')), err)]);
  }
  // 30초마다 바뀐 것만 받고, 10번째(약 5분)마다 또는 오래 비웠다 돌아오면 전체를 받는다.
  // 창을 보고 있지 않을 때는 아무것도 받지 않는다
  let ticks = 0, lastSync = 0;
  async function refresh(force, retry) {
    if (document.hidden && !force) return;
    const full = ++ticks % 30 === 0 || Date.now() - lastSync > 5 * 60e3;   // 전체는 15분마다, 또는 오래 비웠다 돌아왔을 때
    quiet++;
    try {
      await loadAll(full, true); await loadMine(full);
      if (page === 'rumor') await loadRumors();
      lastSync = Date.now();
      if (typing()) renderSide(); else render();
    } catch (e) {
      console.error(e);
      // 화면을 다시 켠 직후처럼 연결이 아직 안 붙었으면 잠시 뒤 한 번 더 받는다
      if (!retry && NET_ERR.test(e?.message || '')) setTimeout(() => refresh(true, true), 5000);
    } finally { quiet--; }
  }
  // 10초마다 가볍게: 바뀐 인물(이곳 사람들), 기록, 받은 인사만 받는다
  async function lightRefresh() {
    if (document.hidden || !started || busy) return;
    quiet++;
    try {
      const rows = await q(db.from('ocs').select(OC_LIGHT).gt('updated_at', syncOc || '1970-01-01'));
      rows.forEach(r => { mergeOc(r); if (r.updated_at > syncOc) syncOc = r.updated_at; });
      await loadPlace();
      if (['here', 'log', 'map'].includes(page) && !typing()) render(); else renderSide();
    } catch (e) { console.error(e); } finally { quiet--; }
  }
  // 강호 날씨: 서울의 실제 날씨 (Open-Meteo, 키 없음). 못 받으면 띠에서 빠진다
  let weather = null;
  const WX = [[0, '맑음'], [3, '구름'], [48, '안개'], [57, '이슬비'], [67, '비'], [77, '눈'], [82, '소나기'], [86, '눈'], [99, '뇌우']];
  async function loadWeather() {
    try {
      const r = await fetch('https://api.open-meteo.com/v1/forecast?latitude=37.57&longitude=126.98&current=temperature_2m,weather_code&timezone=Asia%2FSeoul');
      const c = (await r.json()).current;
      weather = `${WX.find(([n]) => c.weather_code <= n)?.[1] || '흐림'} ${Math.round(c.temperature_2m)}°`;
    } catch { weather = null; }
  }
  // 글을 쓰는 중에는 화면을 다시 그리지 않는다

    const m = $('#main'), ae = document.activeElement;
    return (m.contains(ae) && /INPUT|TEXTAREA|SELECT/.test(ae.tagName)) || [...m.querySelectorAll('textarea, input:not([type=checkbox]):not([type=radio])')].some(e => e.value.trim() && !e.disabled && e.type !== 'number')
      || !!$('.modal-bg');

  function setActive(id) { me = id; lsSet('ghr-active', id); }

  // 넓은 화면은 모든 탭을, 휴대폰은 다섯 칸(지도 · 이곳 · 기록 · 소문 · 더보기)을 아래에 둔다
  const NAV = [
    ['map', '圖', '지도'], ['train', '修', '수련'], ['duel', '武', '비무'], ['life', '業', '생활'], ['letters', '信', '서신'],
    ['timeline', '棧', '객잔'], ['rumor', '聞', '소문'], ['people', '譜', '인물첩'], ['admin', '令', '운영'],
  ];
  const NAV_M = [['map', '圖', '지도'], ['here', '處', '이곳'], ['log', '錄', '기록'], ['rumor', '聞', '소문'], ['more', '他', '더보기']];
  const PARENT = { thread: 'timeline', profile: 'people' };
  const MQ = matchMedia('(max-width: 760px)');
  let page = 'map', arg = null, filter = 'all', editProfile = false, mapSel = null, greetOpen = null;

  function go(p, a = null) {
    page = p; arg = a; editProfile = false;
    if (p === 'rumor') rumorsAt = 0;
    // 프로필은 자주 받지 않으므로, 인물 정보를 열 때 그 사람 것만 새로 받는다
    if (p === 'profile' && a) q(db.from('ocs').select('*').eq('id', a).maybeSingle()).then(r => {
      if (!r) return; mergeOc(r);

  function badge(p) {

  function renderNav() {

  // ── 내 인물 ──

  function renderMe() {

  let finishing = null;
  async function finishAct() {

      if (mineRoad) {
        // 길 가운데에서 길과 직각으로 조금 비켜 적어 장소 이름과 겹치지 않게 한다
        const len = Math.hypot(B.x - A.x, B.y - A.y) || 1, nx = -(B.y - A.y) / len, ny = (B.x - A.x) / len, off = 9 * z;
        svg.append(sv('text', { x: (A.x + B.x) / 2 + nx * off, y: (A.y + B.y) / 2 + ny * off + 3 * z, 'font-size': 10 * z, fill: SUB, 'text-anchor': 'middle' }, `${m}분`));
      }
    });
    const lineOf = (path, attrs) => path.slice(1).forEach((b, k) => { const A = placeOf(path[k]), B = placeOf(b); if (A && B) svg.append(sv('line', { x1: A.x, y1: A.y, x2: B.x, y2: B.y, ...attrs })); });
    // 먼 곳을 고르면 가장 빠른 길을 금빛으로
    const plan = here && mapSel && mapSel !== here && !nb.has(mapSel) ? route(here, mapSel) : null;
    if (plan) lineOf(plan.path, { stroke: GOLD, 'stroke-width': 2 });
    // 길 위에 있으면 가는 길 전체와, 지금 구간에서 지나온 만큼의 자리에 표시
    if (!here && o.dest) {
      const L = legOf(o), A = placeOf(L.a), B = placeOf(L.b);
      lineOf(L.path, { stroke: INK, 'stroke-width': 1.6 });
      if (A && B) {
        const f = Math.max(0, Math.min(1, 1 - (L.end - Date.now()) / L.ms)), x = A.x + (B.x - A.x) * f, y = A.y + (B.y - A.y) * f;
        svg.append(sv('path', { d: `M${x - 6} ${y - 15} h12 l-6 9 z`, fill: INK }));
      }
    }
    MAP.places.forEach(p => {
      const isHere = p.id === here, isNb = nb.has(p.id), sel = p.id === mapSel;
      svg.append(sv('g', { class: 'node', onclick: () => { mapSel = p.id; render(); } },
        sel ? sv('rect', { x: p.x - 9, y: p.y - 9, width: 18, height: 18, fill: 'none', stroke: '#a38552' }) : null,
        sv('rect', { x: p.x - 5 * z, y: p.y - 5 * z, width: 10 * z, height: 10 * z, fill: isHere ? INK : '#fff', stroke: isHere || isNb ? INK : SUB }),
        sv('text', { x: p.x, y: p.y + 9 + 12 * z, 'font-size': 12 * z, 'text-anchor': 'middle', fill: p.risk >= 2 ? RED : isHere || isNb ? INK : SUB, 'font-weight': isHere ? 700 : 400 }, p.id),
        cnt[p.id] ? sv('text', { x: p.x + 6 + 4 * z, y: p.y - 6, 'font-size': 10 * z, fill: SUB }, cnt[p.id]) : null,
        isHere ? sv('path', { d: `M${p.x - 6} ${p.y - 21} h12 l-6 9 z`, fill: INK }) : null,
        sv('rect', { x: p.x - 24, y: p.y - 14, width: 48, height: 42, fill: 'transparent' })));
    });

    // 고른 장소(없으면 지금 있는 곳) 안내
    const P = placeOf(mapSel) || placeOf(here) || placeOf(o.dest);
    let info = null;
    if (P) {
      const people = ocs.filter(x => hereOf(x) === P.id);
      let way;
      if (P.id === here) way = h('p', { class: 'note' }, '지금 이곳에 있습니다.' + (nbs.length ? ` 바로 갈 수 있는 곳: ${nbs.map(n => `${n.id}(${n.mins}분)`).join(' · ')}` : ''));
      else if (!here) {
        const L = legOf(o);
        way = h('div', {}, h('p', { class: 'note' }, `${roJ(o.dest)} 가는 중입니다. ${hm(o.arrive_at)}에 도착합니다.` + (o.route ? ` 지금은 ${L.a}에서 ${L.b} 사이입니다.` : ' 도착한 뒤에 다른 곳으로 떠날 수 있습니다.')),
          o.route && L.next !== o.dest ? h('button', { class: 'btn', style: 'margin-top:10px', onclick: act(travelStop) }, `${L.next}에서 멈추기`) : null);
      }
      else if (o.retreat_until || o.act) way = h('p', { class: 'note' }, o.retreat_until ? '폐관 중에는 떠날 수 없습니다.' : '하던 일을 마치면 떠날 수 있습니다.');
      else if (nb.has(P.id)) way = h('div', { class: 'row', style: 'justify-content:space-between;margin-top:14px' },
        h('span', {}, `${here}에서 ${roadMins(here, P.id)}분`), h('button', { class: 'btn fill', onclick: act(() => travel(P.id)) }, '떠나기'));
      else {
        const r = route(here, P.id);
        way = r ? h('div', { style: 'margin-top:14px' }, h('p', { class: 'note', style: 'margin-top:0' }, `가는 길: ${r.path.join(' → ')} · 모두 ${r.mins}분.`),
          h('div', { class: 'row', style: 'margin-top:10px' },
            h('button', { class: 'btn fill', onclick: act(() => travelRoute(r)) }, `끝까지 가기 · ${r.mins}분`),
            h('button', { class: 'btn', onclick: act(() => travel(r.path[1])) }, `첫걸음 · ${roJ(r.path[1])}`)),
          h('p', { class: 'mut', style: 'font-size:12px;margin-top:8px' }, `끝까지 가기를 고르면 ${r.path.length - 2}곳을 지나 창을 닫아도 시간에 맞춰 도착합니다. 가다가 다음 곳에서 멈출 수 있습니다.`))
          : h('p', { class: 'note' }, '이어진 길이 없습니다.');
      }
      info = h('div', { class: 'card pinfo' }, placeHead(P, P.id), h('p', { class: 'place-d' }, P.desc || ''),
        h('ul', { class: 'kv' },
          h('li', {}, h('span', {}, '나는 것'), h('span', {}, [P.item, P.rare].filter(Boolean).join(' · ') || '—')),
          h('li', {}, h('span', {}, '할 수 있는 일'), h('span', {}, KIND_DO[P.kind] || '탐색')),
          h('li', {}, h('span', {}, '지금 있는 사람'), h('span', {}, people.length ? people.map(x => x.name).join(', ') : '없음'))),
        way);
    }
    return [ph('강호 지도'), h('p', { class: 'mut', style: 'font-size:13px;margin-top:14px' }, '이웃한 곳으로 한 곳씩 가거나, 먼 곳을 눌러 끝까지 한 번에 갈 수 있습니다. 장소를 누르면 자세히 보입니다. 붉은 이름은 위험한 곳입니다.'), svg, info];
  }

  // ── 소문 ────────────────────────────────────
  let rumorReply = null;
  function pRumor() {
    if (!rumorsAt) { rumorsAt = Date.now(); loadRumors().then(() => { if (page === 'rumor' && !typing()) render(); }).catch(() => { rumorsAt = 0; }); }
    const tops = rumors.filter(r => !r.reply_to).reverse(), reps = id => rumors.filter(r => r.reply_to === id);
    const post = async (ta, place, reply) => {
      const v = ta.value.trim(); if (!v) return;
      const r = await q(db.rpc('rumor_post', { p_oc: me, p_body: v, p_place: place || null, p_reply: reply }));
      ta.value = ''; rumorReply = null;
      toast(`'${r.alias}'(이)라는 이름으로 소문을 냈습니다`);
      await loadRumors(); render();
    };
    const ta = h('textarea', { placeholder: '들은 이야기를 적어 보세요. 이름 대신 행인의 호칭이 붙습니다.', maxlength: 200 });
    const cnt = h('span', {}, '0 / 200');
    ta.addEventListener('input', () => { cnt.textContent = `${ta.value.length} / 200`; });
    const plSel = h('select', { class: 'pick', style: 'min-width:0;width:auto;font-size:12px;padding:0' },
      h('option', { value: '' }, '장소 없음'), MAP.places.map(p => h('option', { value: p.id }, p.id)));
    const item = (r, isReply) => h('div', { class: 'post' + (isReply ? ' reply' : '') },
      h('div', { class: 'av rm' }, '聞'),
      h('div', {},
        h('div', { class: 'h' }, h('span', { class: 'alias-nm' }, r.alias), r.place ? h('span', { class: 'tag' }, r.place) : null,
          r.mine ? h('span', { class: 'tag g1' }, '내 소문') : null,
          isAdmin ? h('span', { class: 'mut' }, r.author ? `작성 · ${by(r.author)?.name || '?'}` : r.npc ? '자동 소문' : '') : null,
          h('time', {}, ago(r.t))),
        h('p', {}, r.body),
        h('div', { class: 'acts' },
          h('button', { class: r.liked ? 'on' : '', onclick: act(async () => { await q(db.rpc('rumor_like', { p_oc: me, p_id: r.id })); await loadRumors(); render(); }) }, `공감${r.likes ? ' ' + r.likes : ''}`),
          !isReply ? h('button', { onclick: () => { rumorReply = rumorReply === r.id ? null : r.id; render(); } }, `답글${reps(r.id).length ? ' ' + reps(r.id).length : ''}`) : null,
          isAdmin ? h('button', { onclick: act(async () => {
            if (!(await ask('소문 지우기', '이 소문과 답글을 지울까요?', '지우기'))) return;
            await q(db.from('rumors').delete().eq('id', r.id)); await loadRumors(); render();
          }) }, '지우기') : null)));
    const replyBox = id => {
      const t = h('textarea', { placeholder: '답글 · 이 이야기 안에서는 같은 호칭으로 보입니다', maxlength: 200 });
      return h('div', { class: 'compose', style: 'padding-left:54px' }, h('div', {}, t,
        h('div', { class: 'foot' }, h('span', {}), h('button', { class: 'btn fill', onclick: act(() => post(t, null, id)) }, '답글'))));
    };
    return [ph('소문'),
      h('p', { class: 'mut', style: 'font-size:13px;margin-top:14px' }, `이름 대신 행인의 호칭으로 쓰는 곳입니다. 강호에 떠도는 소문도 함께 올라옵니다. 소문은 ${SET.rumorGap}분에 하나씩 낼 수 있습니다.`),
      h('div', { class: 'compose' }, h('div', { class: 'av rm' }, '聞'), h('div', {}, ta,
        h('div', { class: 'foot' }, h('span', { class: 'row', style: 'gap:12px' }, plSel, cnt), h('button', { class: 'btn fill', onclick: act(() => post(ta, plSel.value, null)) }, '소문 내기')))),
      tops.length ? tops.map(r => [item(r, false), reps(r.id).map(x => item(x, true)), rumorReply === r.id ? replyBox(r.id) : null])
        : empty(rumorsReady ? '아직 소문이 없습니다.' : '소문을 듣는 중입니다.')];
  }

  // ── 휴대폰 전용: 이곳 · 기록 · 더보기 ──────────────
  const pHere = () => [ph('이곳'), h('div', { style: 'margin-top:18px' }, hereBody())];
  const pLog = () => [ph('기록'), logBody()];
  const pMore = () => [ph('더보기'), h('div', { class: 'opts', style: 'margin-top:24px' },
    NAV.filter(([p]) => !NAV_M.some(([m]) => m === p) && (p !== 'admin' || isAdmin)).map(([p, hj, l]) => {
      const n = badge(p);
      return h('button', { class: 'opt', onclick: () => go(p) }, h('b', {}, `${hj} ${l}`), n ? h('small', {}, `새 소식 ${n}`) : null);
    }), h('button', { class: 'opt', onclick: () => startTour() }, h('b', {}, '? 안내'), h('small', {}, '처음 안내를 다시 봅니다')))];

  const PAGES = {
    map: pMap, timeline: pTimeline, thread: pThread, train: pTrain, duel: pDuel, life: pLife, letters: pLetters, rumor: pRumor,
    people: pPeople, profile: pProfile, admin: pAdmin, here: pHere, log: pLog, more: pMore,
  };

  // 남은 시간을 세고, 끝나는 순간 한 번만 처리한다: 짧은 행동은 결과를 받고, 폐관·이동은 화면을 다시 그린다
  const clockDone = new Set();
  function tickClock() {
    const c = $('#clk'); if (c) c.textContent = clockText();
    document.querySelectorAll('[data-until]').forEach(el => {
      // 올림으로 센다: 0이 되는 때가 곧 끝나는 시각이다 (내림이면 1초 일찍 0이 되어 서버가 거절한다)
      const s = Math.max(0, Math.ceil((+el.dataset.until - Date.now()) / 1000));
      el.textContent = !s ? (el.dataset.done || '폐관 완료') : s >= 3600 ? `${Math.floor(s / 3600)}:${pad(Math.floor(s % 3600 / 60))}:${pad(s % 60)}` : `${Math.floor(s / 60)}:${pad(s % 60)}`;
      const key = el.dataset.until + (el.hasAttribute('data-act') ? 'a' : '');
      if (!s && !clockDone.has(key) && !typing()) {
        clockDone.add(key);
        if (el.hasAttribute('data-act')) finishAct(); else loadPlace().catch(() => {}).then(() => { if (!typing()) render(); });
      }
    });
    document.querySelectorAll('[data-prog]').forEach(el => {
      el.style.width = `${Math.max(0, Math.min(100, (1 - (+el.dataset.prog - Date.now()) / +el.dataset.total) * 100))}%`;
    });
  }

  boot();
})();
</script>
</body>
</html>
