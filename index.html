<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>강호록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #fcfcfa; --card: #ffffff; --soft: #f3f2ee; --ink: #151515; --sub: #7b7a75;
    --line: #e4e2dc; --deco: #d6d3cb; --gold: #a38552;
    --serif: 'Noto Serif KR', serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--paper); color: var(--ink); font: 15px/1.7 'Noto Sans KR', sans-serif; -webkit-font-smoothing: antialiased; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: none; }
  .serif { font-family: var(--serif); }
  .mut { color: var(--sub); }

  /* 배경 장식: 구름 띠와 달 */
  .deco { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .deco svg { position: absolute; }
  .deco .tr { top: -20px; right: -40px; width: 520px; }
  .deco .bl { bottom: -30px; left: -60px; width: 460px; }
  .wrap, #toast, #gate { position: relative; z-index: 1; }

  .btn { border: 1px solid var(--ink); padding: 7px 18px; font-size: 13px; background: var(--card); transition: background .15s, color .15s; }
  .btn:hover { background: var(--ink); color: var(--paper); }
  .btn.fill { background: var(--ink); color: var(--paper); }
  .btn.fill:hover { background: #333; }
  .btn.ghost { border-color: var(--line); color: var(--sub); }
  .btn.ghost:hover { border-color: var(--ink); color: var(--paper); }
  .btn:disabled { opacity: .35; cursor: default; }
  .btn:disabled:hover { background: var(--card); color: var(--ink); }
  .link { font-size: 13px; color: var(--sub); }
  .link:hover { color: var(--ink); }
  .link:disabled { opacity: .4; cursor: default; }

  /* 입문 화면 */
  .gate { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
  .gate-box { width: min(440px, 100%); background: var(--card); border: 1px solid var(--ink); box-shadow: 0 0 0 6px var(--card), 0 0 0 7px var(--ink); padding: 32px 28px; }
  .gate-box .mk { width: 56px; height: 56px; margin-bottom: 16px; background: var(--ink); color: var(--paper); display: grid; place-items: center; font-family: var(--serif); font-size: 19px; font-weight: 700; }
  .gate-box h1 { font-family: var(--serif); font-size: 24px; font-weight: 700; margin-bottom: 6px; }
  .gate-box .stack { display: grid; gap: 14px; margin-top: 20px; }
  .gate-box .pick, .gate-box select, .gate-box textarea { width: 100%; min-width: 0; }
  .gate-box .err { font-size: 13px; color: var(--ink); text-decoration: underline; min-height: 20px; }

  /* 3단 */
  .wrap { display: grid; grid-template-columns: 150px minmax(0, 640px) 250px; justify-content: center; gap: 0 48px; padding: 0 28px; }
  nav.side { position: sticky; top: 0; align-self: start; padding: 48px 0; display: flex; flex-direction: column; }
  nav.side button {
    position: relative; display: flex; align-items: baseline; gap: 12px; padding: 9px 0 9px 14px;
    color: var(--sub); border-left: 1px solid var(--line); text-align: left;
  }
  nav.side button i { font-style: normal; font-family: var(--serif); font-size: 13px; opacity: .5; }
  nav.side button:hover { color: var(--ink); }
  nav.side button.on { color: var(--ink); border-left: 2px solid var(--ink); padding-left: 13px; font-weight: 500; }
  nav.side button.on i { opacity: 1; }
  nav.side .n { margin-left: auto; font-size: 11px; min-width: 18px; height: 18px; line-height: 18px; text-align: center; background: var(--ink); color: var(--paper); border-radius: 9px; padding: 0 5px; }
  main { padding: 48px 0 96px; min-width: 0; }
  aside { position: sticky; top: 0; align-self: start; padding: 48px 0; }

  .ph { position: relative; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-bottom: 16px; border-bottom: 1px solid var(--ink); }
  .ph::after { content: ''; position: absolute; left: 0; right: 0; bottom: -5px; border-bottom: 1px solid var(--line); }
  .ph h1 { font-family: var(--serif); font-size: 26px; font-weight: 600; letter-spacing: .06em; }
  .tag { display: inline-block; font-size: 11px; border: 1px solid var(--ink); padding: 0 6px; line-height: 18px; vertical-align: 2px; white-space: nowrap; }
  .tag.npc, .tag.g1 { border-color: var(--gold); color: var(--gold); }
  .tag.g2 { background: var(--ink); color: var(--paper); }
  .empty { padding: 32px 0; text-align: center; font-size: 13px; color: var(--sub); }

  /* 객잔 */
  .av {
    width: 40px; height: 40px; border: 1px solid var(--ink); border-radius: 50%; background: var(--card); flex-shrink: 0; overflow: hidden;
    display: grid; place-items: center; font-family: var(--serif); font-weight: 600; font-size: 16px;
  }
  .av.npc { border-color: var(--gold); color: var(--gold); }
  .av img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .compose { display: flex; gap: 14px; padding: 22px 0 18px; border-bottom: 1px solid var(--line); }
  .compose > div:last-child { flex: 1; }
  .compose textarea { width: 100%; border: none; background: none; resize: none; min-height: 56px; outline: none; }
  .compose .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; font-size: 12px; color: var(--sub); }
  .filters { display: flex; gap: 24px; border-bottom: 1px solid var(--line); font-size: 13px; flex-wrap: wrap; }
  .filters button { padding: 12px 0; color: var(--sub); border-bottom: 1px solid transparent; margin-bottom: -1px; }
  .filters button.on { color: var(--ink); border-bottom-color: var(--ink); }
  .post { display: flex; gap: 14px; padding: 18px 0; border-bottom: 1px solid var(--line); }
  .post > div:last-child { flex: 1; min-width: 0; }
  .post .h { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; font-size: 13px; }
  .post .h .nm { font-weight: 700; font-size: 15px; }
  .nm:hover { text-decoration: underline; text-underline-offset: 3px; }
  .post time { margin-left: auto; color: var(--sub); font-size: 12px; }
  .post p { margin: 4px 0 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .alias { font-family: var(--serif); color: var(--gold); }
  .acts { display: flex; gap: 22px; font-size: 12px; color: var(--sub); }
  .acts button:hover { color: var(--ink); }
  .acts .on { color: var(--ink); font-weight: 700; }
  .post.sys { background: linear-gradient(90deg, var(--soft), transparent 70%); padding-left: 0; }
  .post.sys .lbl {
    width: 40px; flex-shrink: 0; display: grid; place-items: center; height: 40px;
    font-family: var(--serif); font-size: 12px; letter-spacing: .04em; color: var(--paper); background: var(--ink);
  }
  .post.sys p { font-family: var(--serif); margin-top: 8px; }
  .post.reply { padding-left: 54px; }
  .back { margin: 0 0 14px; }

  /* 수련 */
  .realm { padding: 32px 0 0; display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; }
  .realm .lbl { font-size: 12px; color: var(--sub); letter-spacing: .12em; }
  .realm .big { font-family: var(--serif); font-size: 48px; font-weight: 700; line-height: 1.15; }
  .realm .big small { font-size: 18px; font-weight: 400; margin-left: 10px; color: var(--sub); }
  .realm .qi { text-align: right; }
  .realm .qi b { font-family: var(--serif); font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .meter { height: 3px; background: var(--line); margin: 18px 0 8px; }
  .meter i { display: block; height: 100%; background: var(--ink); }
  .under { display: flex; justify-content: space-between; font-size: 12px; color: var(--sub); font-variant-numeric: tabular-nums; }
  .ladder { display: grid; grid-template-columns: var(--cols); gap: 5px; margin-top: 18px; }
  .ladder .gap { border-left: 1px dashed var(--deco); margin-left: 3px; }
  .rung { text-align: center; }
  .rung .ticks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; margin-bottom: 6px; }
  .rung .ticks i { height: 8px; border: 1px solid var(--ink); }
  .rung .ticks i.f { background: var(--ink); }
  .rung span { font-family: var(--serif); font-size: 12px; color: var(--sub); }
  .rung.cur span { color: var(--ink); font-weight: 700; }
  .rung.lock .ticks i { border-style: dashed; border-color: var(--deco); }
  .rung.lock span { color: var(--deco); }
  .path { list-style: none; display: grid; grid-template-columns: repeat(var(--n, 8), 1fr); border-top: 1px solid var(--line); }
  .path li { position: relative; padding: 14px 4px 0; text-align: center; }
  .path li i { display: block; width: 9px; height: 9px; margin: -19px auto 10px; border: 1px solid var(--ink); background: var(--paper); transform: rotate(45deg); }
  .path li.f i { background: var(--ink); }
  .path li.nx i { background: var(--gold); border-color: var(--gold); }
  .path span { display: block; font-family: var(--serif); font-size: 13px; line-height: 1.35; word-break: keep-all; }
  .path li:not(.f):not(.nx) span { color: var(--sub); }
  .path li.nx span { font-weight: 700; }
  .path small { display: block; font-size: 11px; color: var(--sub); margin-top: 2px; }
  .bt { margin-top: 24px; border: 1px solid var(--ink); background: var(--card); padding: 18px 20px; display: flex; justify-content: space-between; align-items: center; gap: 16px; }
  .bt b { font-family: var(--serif); font-size: 17px; }
  .bt p { font-size: 13px; color: var(--sub); }
  .nums { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin-top: 28px; }
  .nums div { padding: 16px 0; }
  .nums div + div { padding-left: 20px; border-left: 1px solid var(--line); }
  .nums small { display: block; font-size: 12px; color: var(--sub); }
  .nums b { font-size: 20px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .sec { margin-top: 44px; }
  .sec > h2 { font-family: var(--serif); font-size: 17px; font-weight: 600; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .sec > .desc { font-size: 13px; color: var(--sub); margin: -6px 0 14px; }
  .opts { display: grid; grid-template-columns: repeat(var(--n, 3), 1fr); border: 1px solid var(--ink); background: var(--card); }
  .opt { padding: 20px; text-align: left; display: flex; flex-direction: column; gap: 2px; transition: background .15s, color .15s; }
  .opt + .opt { border-left: 1px solid var(--ink); }
  .opt b { font-family: var(--serif); font-size: 22px; font-weight: 600; margin-bottom: 6px; }
  .opt small { font-size: 12px; color: var(--sub); }
  .opt:hover { background: var(--ink); color: var(--paper); }
  .opt:hover small { color: inherit; opacity: .7; }
  .count { border: 1px solid var(--ink); background: var(--card); padding: 30px 20px; text-align: center; }
  .count .big { font-family: var(--serif); font-size: 40px; letter-spacing: .06em; font-variant-numeric: tabular-nums; margin: 4px 0 10px; }

  /* 비무 */
  .card { border: 1px solid var(--ink); background: var(--card); padding: 18px 20px; }
  .card + .card { margin-top: 12px; }
  .card .top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .moves { display: grid; gap: 6px; margin: 16px 0; }
  .mv { display: grid; grid-template-columns: 44px repeat(3, 1fr); align-items: center; }
  .mv span { font-size: 12px; color: var(--sub); }
  .mv button { border: 1px solid var(--line); padding: 6px 0; font-family: var(--serif); font-size: 14px; }
  .mv button + button { border-left: none; }
  .mv button:hover { background: var(--soft); }
  .mv button.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .pick { border: none; border-bottom: 1px solid var(--line); background: none; padding: 4px 0; outline: none; min-width: 200px; }
  .rule { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 28px; align-items: center; }
  .rule svg { width: 100%; height: auto; }
  .rule dl { display: grid; gap: 14px; }
  .rule dt { font-family: var(--serif); font-weight: 600; }
  .rule dt span { font-size: 22px; margin-right: 8px; }
  .rule dd { font-size: 13px; color: var(--sub); }
  .note { font-size: 13px; color: var(--sub); border-left: 2px solid var(--line); padding-left: 14px; margin-top: 18px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { font-weight: 500; color: var(--sub); text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--ink); white-space: nowrap; }
  td { padding: 10px 8px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; vertical-align: top; }
  td.w { font-family: var(--serif); font-size: 16px; font-weight: 600; white-space: nowrap; }
  tr.mine td { background: var(--soft); }
  .res { display: grid; grid-template-columns: 1fr auto 1fr; gap: 16px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .res > div:last-child { text-align: right; }
  .res .win { font-family: var(--serif); font-size: 12px; margin: 0 6px; border: 1px solid var(--ink); padding: 0 4px; }
  .dots { display: flex; gap: 5px; }
  .dot { width: 9px; height: 9px; border: 1px solid var(--ink); border-radius: 50%; }
  .dot.l { background: var(--ink); }
  .dot.d { border-color: var(--deco); background: var(--deco); }

  /* 서신 */
  .mail { display: grid; grid-template-columns: 200px minmax(0, 1fr); border: 1px solid var(--ink); margin-top: 24px; background: var(--card); }
  .threads { border-right: 1px solid var(--line); }
  .threads button { display: block; width: 100%; text-align: left; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .threads button.on { background: var(--soft); }
  .threads b { display: block; font-size: 14px; font-weight: 500; }
  .threads small { display: block; font-size: 12px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .threads .unread b::after { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--ink); margin-left: 8px; vertical-align: middle; }
  .conv { display: flex; flex-direction: column; min-height: 460px; }
  .conv .hd { padding: 14px 20px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .conv .hd b { font-family: var(--serif); font-weight: 600; }
  .msgs { flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 16px; overflow: auto; max-height: 420px; }
  .msg { max-width: 80%; }
  .msg .body { border: 1px solid var(--line); background: var(--paper); padding: 10px 14px; white-space: pre-wrap; }
  .msg.me { align-self: flex-end; }
  .msg.me .body { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .msg.fly .body { background: var(--card); color: var(--sub); border: 1px dashed var(--ink); }
  .msg small { display: block; font-size: 11px; color: var(--sub); margin-top: 4px; }
  .msg.me small { text-align: right; }
  .conv .in { border-top: 1px solid var(--line); display: flex; align-items: flex-end; padding: 10px 12px 10px 20px; gap: 12px; }
  .conv textarea { flex: 1; border: none; background: none; resize: none; outline: none; height: 48px; }

  /* 인물첩 */
  .search { width: 100%; margin: 24px 0 0; border: none; border-bottom: 1px solid var(--line); background: none; padding: 8px 0; outline: none; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .pc { display: flex; gap: 14px; padding: 18px 0; border-bottom: 1px solid var(--line); text-align: left; }
  .grid .pc:nth-child(odd) { padding-right: 20px; border-right: 1px solid var(--line); }
  .grid .pc:nth-child(even) { padding-left: 20px; }
  .pc > div:last-child { min-width: 0; }
  .pc .meta { font-size: 12px; color: var(--sub); }
  .pc p { font-size: 13px; color: var(--sub); margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .pc:hover .nm { text-decoration: underline; text-underline-offset: 3px; }
  .book { margin-top: 18px; }
  .book h3 { font-family: var(--serif); font-size: 14px; font-weight: 600; padding-bottom: 6px; border-bottom: 1px solid var(--ink); }
  .book-row { display: grid; grid-template-columns: 48px 92px minmax(0, 1fr) 90px; gap: 12px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .book-row b { font-family: var(--serif); font-weight: 600; font-size: 14px; }
  .book-row .owner { text-align: right; font-size: 12px; }
  .prof { display: flex; gap: 22px; padding: 32px 0 24px; border-bottom: 1px solid var(--line); }
  .prof h1 { font-family: var(--serif); font-size: 28px; font-weight: 600; line-height: 1.3; }
  .seal-frame { width: 136px; height: 136px; flex-shrink: 0; border: 1px solid var(--ink); padding: 5px; background: var(--card); }
  .seal-frame.npc { border-color: var(--gold); }
  .seal-frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .seal-ph {
    width: 100%; height: 100%; border: 1px solid var(--ink); display: flex; align-items: center; justify-content: center;
    writing-mode: vertical-rl; font-family: var(--serif); font-weight: 700; font-size: 26px; letter-spacing: .25em;
  }
  .quote { font-family: var(--serif); font-size: 16px; margin-top: 14px; padding-left: 14px; border-left: 2px solid var(--ink); }
  .info { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 28px; border-top: 1px solid var(--line); }
  .info > div { display: flex; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .info dt { width: 80px; flex-shrink: 0; color: var(--sub); font-size: 13px; }
  .prose { white-space: pre-wrap; }
  .ties { list-style: none; border-top: 1px solid var(--line); }
  .ties li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .ties .nm { font-weight: 700; }
  .tie-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr) auto; gap: 16px; align-items: end; padding: 6px 0; }
  .form input:disabled { color: var(--sub); }

  /* 생활 */
  .job { display: flex; gap: 22px; align-items: center; padding: 28px 0 24px; border-bottom: 1px solid var(--line); }
  .job-hj { width: 64px; height: 64px; flex-shrink: 0; border: 1px solid var(--ink); display: grid; place-items: center; font-family: var(--serif); font-size: 30px; font-weight: 700; }
  .job .lbl { font-size: 12px; color: var(--sub); letter-spacing: .12em; }
  .job b { font-family: var(--serif); font-size: 24px; font-weight: 600; }
  .job-side { display: flex; gap: 28px; text-align: right; }
  .job-side small { display: block; font-size: 12px; color: var(--sub); }
  .job-side b { font-size: 20px; font-family: inherit; font-weight: 500; font-variant-numeric: tabular-nums; }
  .stam i { display: inline-block; width: 11px; height: 11px; border: 1px solid var(--ink); border-radius: 50%; margin-left: 5px; margin-top: 10px; }
  .stam i.f { background: var(--ink); }
  .opts.jobs .opt:nth-child(3n+1) { border-left: none; }
  .opts.jobs .opt:nth-child(n+4) { border-top: 1px solid var(--ink); }

  /* 운영 */
  .tbl { overflow-x: auto; }
  td input, td select { border: none; border-bottom: 1px solid var(--line); background: none; width: 100%; min-width: 64px; outline: none; padding: 2px 0; }
  .field { width: 100%; border: 1px solid var(--line); background: var(--card); padding: 12px 14px; outline: none; resize: vertical; min-height: 80px; }
  .form { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px 18px; }
  .form label { display: flex; flex-direction: column; font-size: 12px; color: var(--sub); }
  .form label > * { color: var(--ink); font-size: 14px; }
  .form .wide { grid-column: 1 / -1; }
  .form input, .form select { border: none; border-bottom: 1px solid var(--line); background: none; padding: 4px 0; outline: none; }
  .field:focus, .pick:focus, .search:focus, td input:focus, .form input:focus { border-color: var(--ink); }
  .subtabs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 24px; }
  .subtabs button { border: 1px solid var(--line); padding: 4px 12px; font-size: 13px; color: var(--sub); background: var(--card); }
  .subtabs button:hover { border-color: var(--ink); color: var(--ink); }
  .subtabs button.on { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  table.cfg td { padding: 6px 6px; vertical-align: middle; }
  table.cfg td input[type=number] { min-width: 52px; }
  .cfg-card { border: 1px solid var(--line); background: var(--card); padding: 16px 18px; }
  .cfg-card + .cfg-card { margin-top: 10px; }
  .stage-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px 14px; }
  .chk { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink); }
  .chk input[type=number] { width: 56px; }
  .savebar {
    position: sticky; bottom: 0; z-index: 3; margin-top: 36px; padding: 14px 0; background: var(--paper);
    border-top: 1px solid var(--ink); display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 12px;
  }
  .addrow { display: flex; gap: 10px; align-items: center; margin-top: 10px; }

    F({ name: '폐허가 된 대장간', where: ['채집'], w: 5, drop: [0, 90, 10], post: '버려진 대장간 화로 밑에서 병기를 찾았다.' }),
    F({ name: '돈오(頓悟)', where: ['폐관'], min: 12, w: 5, insight: 60, path: true, post: '오랜 폐관 끝에 문득 깨달았다.' }),
  ];
  const JOBS = {
    의원: { hj: '醫', work: '진료', gain: { fame: 6, silver: 20 }, craft: { 소환단: { 약초: 3 } } },
    대장장이: { hj: '冶', work: '담금질', gain: { silver: 35 }, craft: { '정비한 무기': { 철광석: 2 } } },
    숙수: { hj: '膳', work: '객잔 주방 일', gain: { silver: 25, fame: 3 }, craft: { 보양식: { 식재료: 3 } } },
    상인: { hj: '商', work: '장사', gain: { silver: 50 }, craft: {} },
    악사: { hj: '樂', work: '연주', gain: { fame: 10 }, craft: {} },
    서생: { hj: '書', work: '필사', gain: { insight: 8, silver: 10 }, craft: { '비급 필사본': { 먹: 2 } } },
  };
  const ITEMS = {
    약초: ['산에서 캔 약초', 6], 철광석: ['대장간에 쓰는 광석', 8], 식재료: ['강과 저자에서 구한 재료', 5], 먹: ['필사에 쓰는 먹', 7],
    소환단: ['다음 돌파 성공률 +10%', 60], '정비한 무기': ['다음 비무 판정 +0.25', 50], 보양식: ['다음 폐관 내공 +20%', 40], '비급 필사본': ['깨달음 +30', 70],
  };
  const ERRANDS = [
    ['잃어버린 고양이를 찾아 주었다', { silver: 15, fame: 4 }], ['표국 짐을 산 아래까지 날라 주었다', { silver: 30 }],
    ['객잔 주인의 장부 정리를 도왔다', { silver: 20, insight: 3 }], ['길 잃은 아이를 마을까지 데려다주었다', { fame: 8 }],
  ];
  const MASTERY = ['견습', '일꾼', '숙련', '장인', '대가'], MASTERY_XP = [0, 10, 30, 60, 100];

  const CFG = { REALMS, SUBS, TIERS, BREAK_RATE, SET, RETREATS, WEAPONS, PATH_NEED, PATH_REALM, GRADES, ARMS_LIST, FORTUNES, JOBS, ITEMS, ERRANDS, MASTERY, MASTERY_XP };
  const DEFAULTS = structuredClone(CFG);
  const replaceIn = (t, s) => { if (Array.isArray(t)) t.splice(0, t.length, ...s); else { Object.keys(t).forEach(k => delete t[k]); Object.assign(t, s); } };
  // DB에 저장된 설정을 덮어씌운다. SET은 새로 생긴 항목이 빠지지 않도록 기본값과 합친다
  function applySettings(data) {
    if (!data || !Object.keys(data).length) return false;
    Object.keys(CFG).forEach(k => {
      if (data[k] === undefined) return;
      replaceIn(CFG[k], k === 'SET' ? { ...DEFAULTS.SET, ...data.SET } : data[k]);
    });
    return true;
  }

  // ── 설정에서 파생되는 계산 ────────────────────
  const MOVES = { 공: '攻', 수: '守', 허: '虛' };
  const MOVE_RO = { 공: '攻으로', 수: '守로', 허: '虛로' };
  const TRAIT_KINDS = {
    draw: ['비긴 합 점수', p => `비긴 합도 ${p}점으로 칩니다`],
    round: ['특정 합 승리', p => `${p}합에서 이기면 1.5점입니다`],
    move: ['특정 초식 승리', p => `${MOVE_RO[p]} 이긴 합은 1.5점입니다`],
    streak: ['연승 보너스', p => `두 합을 잇달아 이기면 ${p}점을 더 얻습니다`],
    shield: ['패배 무효', p => `처음 진 합 ${p}개를 비긴 것으로 칩니다`],
  };
  const traitDesc = x => x && TRAIT_KINDS[x.kind] ? TRAIT_KINDS[x.kind][1](x.param) : '';
  const USABLE = ['소환단', '정비한 무기', '보양식', '비급 필사본'];
  const GAIN_LABEL = { silver: '은자', fame: '명성', insight: '깨달음' };
  const rIdx = lv => Math.floor((lv - 1) / 3), sIdx = lv => (lv - 1) % 3;
  const realm = lv => REALMS[rIdx(lv)] || '?';
  const realmFull = lv => `${realm(lv)} ${SUBS[sIdx(lv)]}`;
  const tierOf = (r, tiers = TIERS) => [...tiers].reverse().find(t => r >= t.from) || tiers[0];
  const sealedAt = r => { const t = tierOf(r); return t.gate && !t.open ? t : null; };
  const energy = lv => tierOf(rIdx(lv)).energy;
  const needQi = lv => Math.round(SET.qiBase * SET.qiGrowth ** (lv - 1));
  const gainQi = (hr, lv) => Math.round(hr * SET.gainBase * SET.gainGrowth ** (lv - 1));
  const pathOf = w => ({ name: WEAPONS[w]?.path || w, stages: WEAPONS[w]?.stages || [] });
  const gradeIdx = name => GRADES.findIndex(g => g.name === name);
  const loreOf = name => (ARMS_LIST.find(a => a.name === name) || {}).lore || '';

  // ════════════════════════════════════════════
  // 데이터
  // ════════════════════════════════════════════
  let db, user = null, isAdmin = false, started = false;
  let ocs = [], posts = [], replies = new Map(), duelsIn = [], duelsOut = [], results = [];
  let me = null;                              // 지금 활동 중인 인물 id
  const letters = new Map(), unread = new Set();

  const by = id => ocs.find(o => o.id === id);
  const canAct = o => !!(o && user && o.owner === user.id);
  const mine = () => ocs.filter(canAct);
  const todayKST = () => new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);

  // 인물 한 줄 ↔ 화면에서 쓰는 객체. profile·life는 펼쳐서 쓰고 저장할 때 다시 묶는다
  const PROFILE_KEYS = ['aff', 'bio', 'courtesy', 'age', 'gender', 'origin', 'master', 'quote', 'look', 'persona', 'story', 'ties', 'seal'];
  const LIFE_KEYS = ['job', 'jobXp', 'stamina', 'day', 'bag', 'breakBonus', 'duelBuff', 'retreatBuff'];
  const pickKeys = (o, ks) => Object.fromEntries(ks.filter(k => o[k] !== undefined).map(k => [k, o[k]]));
  function fromRow(r) {
    const o = {
      ...r.profile, ...r.life, id: r.id, owner: r.owner, npc: r.npc, name: r.name, title: r.title, weapon: r.weapon,
      lv: r.lv, qi: Number(r.qi), fame: r.fame, silver: r.silver, insight: r.insight, path: r.path, w: r.w, l: r.l, d: r.d, hours: r.hours,
      retreat_hours: r.retreat_hours, retreat_until: r.retreat_until ? Date.parse(r.retreat_until) : null, arms: r.arms || [],
    };
    o.aff = o.aff || '무소속'; o.bag = o.bag || {}; o.jobXp = o.jobXp || 0; o.ties = o.ties || [];
    o.stamina = o.stamina ?? SET.stamina; o.breakBonus = o.breakBonus || 0;
    o.equip = o.arms.find(a => a.uid === r.equip) || null;
    return o;
  }
  const toRow = o => ({
    lv: o.lv, qi: o.qi, fame: o.fame, silver: o.silver, insight: o.insight, path: o.path, w: o.w, l: o.l, d: o.d, hours: o.hours,
    retreat_hours: o.retreat_hours || null, retreat_until: o.retreat_until ? new Date(o.retreat_until).toISOString() : null,
    profile: pickKeys(o, PROFILE_KEYS), life: pickKeys(o, LIFE_KEYS), arms: o.arms, equip: o.equip?.uid || null,
  });

  const ERR = { '23505': '이미 쓰이는 이름입니다.', '23514': '입력한 내용의 길이를 확인해 주세요.', '42501': '권한이 없습니다.' };
  async function q(req) {
    const { data, error } = await req;
    if (error) { toast(ERR[error.code] || error.message); throw error; }
    return data;
  }
  const saveOc = o => q(db.from('ocs').update(toRow(o)).eq('id', o.id));
  const saveSettings = () => q(db.from('settings').update({ data: structuredClone(CFG), updated_at: new Date().toISOString() }).eq('id', 1));

  const toPost = r => ({ id: r.id, kind: r.kind, oc: r.oc_id, body: r.body, t: r.created_at, reply_to: r.reply_to, likes: (r.reactions || []).map(x => x.oc_id) });
  let settingsFound = false;
  async function loadAll() {
    const [set, ocRows, postRows] = await Promise.all([
      q(db.from('settings').select('data').eq('id', 1).maybeSingle()),
      q(db.from('ocs').select('*').order('created_at')),
      q(db.from('posts').select('id, oc_id, kind, body, reply_to, created_at, reactions(oc_id)').order('created_at', { ascending: false }).limit(400)),
    ]);
    settingsFound = applySettings(set?.data);
    ocs = ocRows.map(fromRow);
    const all = postRows.map(toPost);
    posts = all.filter(p => !p.reply_to);
    replies = new Map();
    all.filter(p => p.reply_to).reverse().forEach(p => { if (!replies.has(p.reply_to)) replies.set(p.reply_to, []); replies.get(p.reply_to).push(p); });
  }
  // 활동 인물 기준: 서신, 비무, 받은 선물
  async function loadMine() {
    if (!me) return;
    const [ls, dIn, dOut, done, pend, gifts] = await Promise.all([
      q(db.from('letters').select('*').or(`from_oc.eq.${me},to_oc.eq.${me}`).order('created_at').limit(600)),
      q(db.from('duels').select('*').eq('defender', me).eq('status', 'pending').order('created_at')),
      q(db.from('duels').select('*').eq('challenger', me).eq('status', 'pending').order('created_at')),
      q(db.from('duels').select('*').eq('status', 'done').order('resolved_at', { ascending: false }).limit(30)),
      q(db.from('duels').select('*').eq('status', 'done').or(`and(challenger.eq.${me},applied_a.eq.false),and(defender.eq.${me},applied_b.eq.false)`)),
      q(db.from('gifts').select('*').eq('to_oc', me).eq('seen', false).order('created_at')),
    ]);
    const byOther = new Map(); unread.clear();
    for (const r of ls) {
      const out = r.from_oc === me, other = out ? r.to_oc : r.from_oc;
      if (!byOther.has(other)) byOther.set(other, []);
      byOther.get(other).push({ id: r.id, me: out, body: r.body, t: r.created_at, fly: out && Date.parse(r.arrive_at) > Date.now() ? hm(r.arrive_at) : null, read: !!r.read_at });
      if (!out && !r.read_at) unread.add(other);
    }
    letters.clear();
    [...byOther].sort((a, b) => Date.parse(b[1].at(-1).t) - Date.parse(a[1].at(-1).t)).forEach(([k, v]) => letters.set(k, v));
    duelsIn = dIn.map(d => ({ id: d.id, from: d.challenger, t: d.created_at }));
    duelsOut = dOut.map(d => ({ id: d.id, to: d.defender, t: d.created_at }));
    results = done.filter(d => d.result).map(d => ({ a: d.challenger, b: d.defender, r: d.result.rounds.map(x => x.r), win: d.result.winner, t: d.resolved_at }));
    await applyPending(pend, gifts);
  }
  // 다른 사람이 남긴 비무 결과와 선물을 내 인물에 반영한다 (인물은 주인만 고친다)
  async function applyPending(duels, gifts) {
    const o = by(me);
    if (!canAct(o) || (!duels.length && !gifts.length)) return;
    const pops = [];
    for (const d of duels) {
      const side = d.challenger === me ? 'a' : 'b', dl = d.result.delta[side];
      o.fame += dl.fame || 0; o.insight += dl.insight || 0; o.w += dl.w || 0; o.l += dl.l || 0; o.d += dl.d || 0;
      o.duelBuff = 0;
      const other = by(side === 'a' ? d.defender : d.challenger);
      pops.push({
        mark: '武', kicker: '비무 결과', title: !d.result.winner ? '무승부' : d.result.winner === me ? '승리' : '패배',
        story: '세 합을 겨뤘습니다.',
        lines: [['상대', other?.name || '?'], ['합', d.result.rounds.map(x => (side === 'a' ? x.r : { l: 'r', r: 'l', d: 'd' }[x.r])).map(x => ({ l: '이김', r: '짐', d: '비김' }[x])).join(' · ')],
          ['명성', `+${dl.fame || 0}`], ['깨달음', `+${dl.insight || 0}`]],
      });
    }
    for (const g of gifts) {
      let arm = null, what;
      if (g.kind === 'item') { o.bag[g.name] = (o.bag[g.name] || 0) + g.qty; what = `${g.name} ${g.qty}개`; }
      else if (g.kind === 'arm') { arm = { uid: crypto.randomUUID(), ...g.arm }; o.arms.push(arm); what = `병기 「${arm.name}」`; }
      else { o.silver += g.qty; what = `은자 ${fmt(g.qty)}`; }
      pops.push({ mark: '禮', kicker: `${g.from_name}의 선물`, title: what, story: g.msg, arm });
    }
    await saveOc(o);
    const aIds = duels.filter(d => d.challenger === me).map(d => d.id), bIds = duels.filter(d => d.defender === me).map(d => d.id);
    if (aIds.length) await q(db.from('duels').update({ applied_a: true }).in('id', aIds));
    if (bIds.length) await q(db.from('duels').update({ applied_b: true }).in('id', bIds));
    if (gifts.length) await q(db.from('gifts').update({ seen: true }).in('id', gifts.map(g => g.id)));
    pops.forEach(popup);
  }

  // ── 공통 ──────────────────────────────────
  const $ = s => document.querySelector(s);
  const h = (tag, props, ...kids) => {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(props || {})) {
      if (v == null || v === false) continue;
      if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else if (k === 'class') el.className = v;
      else el.setAttribute(k, v === true ? '' : v);
    }
    for (const c of kids.flat(Infinity)) if (c != null && c !== false) el.append(c);
    return el;
  };
  const fmt = n => Number(n || 0).toLocaleString('ko-KR');
  const pad = n => String(n).padStart(2, '0');
  const hm = t => { const d = new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  const ago = t => {
    const s = (Date.now() - Date.parse(t)) / 1000, d = new Date(t);
    return s < 60 ? '방금' : s < 3600 ? `${Math.floor(s / 60)}분 전` : s < 86400 ? `${Math.floor(s / 3600)}시간 전` : `${d.getMonth() + 1}.${d.getDate()}`;
  };
  const ph = t => h('div', { class: 'ph' }, h('h1', {}, t));
  const sec = (title, desc, ...kids) => h('div', { class: 'sec' }, h('h2', {}, title), desc ? h('p', { class: 'desc' }, desc) : null, kids);
  const empty = t => h('p', { class: 'empty' }, t);
  let toastT;
  const toast = m => { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2800); };
  const name = o => o ? h('button', { class: 'nm', onclick: () => go('profile', o.id) }, o.name) : h('span', { class: 'mut' }, '[사라진 인물]');
  const av = o => h('div', { class: 'av' + (o?.npc ? ' npc' : '') }, o?.seal ? h('img', { src: o.seal, alt: '' }) : (o ? [...o.name][0] : '?'));
  const npcTag = o => o?.npc ? h('span', { class: 'tag npc' }, 'NPC') : null;
  const gradeTag = g => h('span', { class: 'tag g' + gradeIdx(g) }, g);
  const pickW = list => { let r = Math.random() * list.reduce((s, x) => s + x.w, 0); return list.find(x => (r -= x.w) < 0) || list[list.length - 1]; };
  const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };

  // 버튼을 두 번 눌러 같은 일이 두 번 저장되지 않도록 한 번에 하나씩만 처리한다
  let busy = false;
  const act = fn => async (...a) => {
    if (busy) return;
    busy = true;
    try { await fn(...a); } catch (e) { console.error(e); } finally { busy = false; }
  };

  // 객잔 글은 바로 화면에 보이고, 저장이 끝나면 id를 받아 둔다
  function newPost(kind, oc, body, replyTo = null) {
    const p = { id: 'tmp-' + Math.random(), kind, oc, body, t: new Date().toISOString(), reply_to: replyTo, likes: [] };
    if (replyTo) { if (!replies.has(replyTo)) replies.set(replyTo, []); replies.get(replyTo).push(p); } else posts.unshift(p);
    q(db.from('posts').insert({ oc_id: oc, kind, body, reply_to: replyTo }).select('id').single()).then(r => { p.id = r.id; }).catch(() => {});
    return p;
  }

  // ════════════════════════════════════════════
  // 시작
  // ════════════════════════════════════════════
  function gate(title, kids) {
    $('.wrap').style.display = 'none';
    $('#gate').replaceChildren(h('div', { class: 'gate' }, h('div', { class: 'gate-box' }, h('div', { class: 'mk' }, '江湖'), h('h1', {}, title), kids)));
  }
  async function boot() {
    if (!SUPABASE_URL || !SUPABASE_ANON_KEY) return gate('연결 설정이 필요합니다', h('p', { class: 'mut' }, 'index.html 위쪽의 SUPABASE_URL과 SUPABASE_ANON_KEY를 채워 주세요.'));
    db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const { data: { session } } = await db.auth.getSession();
    session ? start(session.user) : showAuth();
  }
  function showAuth() {
    const email = h('input', { class: 'pick', type: 'email', placeholder: '이메일', autocomplete: 'email' });
    const pw = h('input', { class: 'pick', type: 'password', placeholder: '비밀번호 (6자 이상)', autocomplete: 'current-password' });
    const err = h('p', { class: 'err' });
    const submit = act(async signup => {
      err.textContent = '';
      const cred = { email: email.value.trim(), password: pw.value };
      const { data, error } = signup ? await db.auth.signUp(cred) : await db.auth.signInWithPassword(cred);
      if (error) return void (err.textContent = error.message === 'Invalid login credentials' ? '이메일이나 비밀번호가 맞지 않습니다.' : error.message);
      if (!data.session) return void (err.textContent = '확인 메일을 보냈습니다. 메일의 링크를 누른 뒤 로그인해 주세요.');
      await start(data.session.user);
    });
    pw.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) submit(false); });
    gate('강호에 들어서기', [h('p', { class: 'mut', style: 'font-size:13px' }, '처음이라면 이메일과 비밀번호를 적고 가입을 눌러 주세요.'),
      h('div', { class: 'stack' }, email, pw, h('div', { class: 'row' }, h('button', { class: 'btn fill', onclick: () => submit(false) }, '로그인'), h('button', { class: 'btn', onclick: () => submit(true) }, '가입')), err)]);
  }
  async function start(u) {
    user = u;
    const prof = await q(db.from('profiles').select('is_admin').eq('id', user.id).maybeSingle());
    isAdmin = !!prof?.is_admin;
    await loadAll();
    if (isAdmin && !settingsFound) await saveSettings();   // 처음 운영자가 들어오면 기본 설정을 저장
    if (!mine().length) return createOc();
    const saved = lsGet('ghr-active');
    me = mine().some(o => o.id === saved) ? saved : (mine().find(o => !o.npc) || mine()[0]).id;
    await dailyReset();
    await loadMine();
    $('#gate').replaceChildren(); $('.wrap').style.display = '';
    render();
    if (!started) { started = true; setInterval(refresh, 30000); setInterval(tickClock, 1000); }
  }
  // 기력은 한국 시간 자정마다 다시 찬다
  async function dailyReset() {
    const day = todayKST();
    for (const o of mine()) if (o.day !== day) { o.stamina = SET.stamina; o.day = day; await saveOc(o); }
  }
  function createOc() {
    const nm = h('input', { class: 'pick', placeholder: '이름 (20자까지)', maxlength: 20 });

            lab('객잔에 올라갈 문구', fIn(f, 'post'), 'wide')),
          h('div', { class: 'row', style: 'justify-content:space-between;margin-top:12px' }, h('span', { class: 'mut', style: 'font-size:12px' }, fortuneDesc(f, D.GRADES)), del(() => { D.FORTUNES.splice(i, 1); })))),
        addLink('+ 기연 더하기', () => D.FORTUNES.push(F({ name: '새 기연', where: ['폐관'], w: 10, post: '알 수 없는 인연을 만났다.' })))),
    ],
    life: D => [
      sec('생업', '하루 일로 얻는 것과 만드는 물건입니다. 재료는 "약초 3, 먹 1"처럼 적습니다.',
        grid(['생업', '한자', '일', '은자', '명성', '깨달음', '만드는 물건', '재료'], Object.entries(D.JOBS).map(([k, J]) => {
          const [item, mats] = Object.entries(J.craft)[0] || ['', {}];
          const st = { item, mats: Object.entries(mats).map(([m, n]) => `${m} ${n}`).join(', ') };
          const sync = () => { J.craft = st.item ? { [st.item]: Object.fromEntries(st.mats.split(',').map(s => s.trim().split(/\s+/)).filter(p => p[0]).map(([m, n]) => [m, +n || 1])) } : {}; };
          return [h('b', { class: 'serif' }, k), fIn(J, 'hj', 'text', { style: 'width:36px;min-width:0' }), fIn(J, 'work', 'text', { style: 'width:90px' }),
            num(J.gain, 'silver', 56), num(J.gain, 'fame', 56), num(J.gain, 'insight', 56),
            h('input', { value: st.item, placeholder: '없음', style: 'width:100px', oninput: e => { st.item = e.target.value.trim(); sync(); } }),
            h('input', { value: st.mats, placeholder: '약초 3', style: 'width:110px', oninput: e => { st.mats = e.target.value; sync(); } })];
        }))),
      sec('물품', '물품 설명과 팔 때 받는 값입니다.',
        grid(['물품', '설명', '값', ''], Object.entries(D.ITEMS).map(([k, it]) => [h('b', { class: 'serif' }, k), fIn(it, 0, 'text', { style: 'min-width:200px' }), num(it, 1), del(() => { delete D.ITEMS[k]; })])),
        addRow('새 물품 이름', v => { if (D.ITEMS[v]) return toast('이미 있는 물품입니다'); D.ITEMS[v] = ['', 10]; render(); })),
      sec('객잔 의뢰', '의뢰를 맡으면 이 중 하나가 무작위로 나옵니다.',
        grid(['내용', '은자', '명성', '깨달음', ''], D.ERRANDS.map((e, i) => [fIn(e, 0, 'text', { style: 'min-width:240px' }), num(e[1], 'silver', 56), num(e[1], 'fame', 56), num(e[1], 'insight', 56), del(() => { D.ERRANDS.splice(i, 1); })])),
        addLink('+ 의뢰 더하기', () => D.ERRANDS.push(['새 의뢰를 마쳤다', { silver: 10 }]))),
      sec('숙련과 기력', '',
        grid(['숙련', '필요 경험'], D.MASTERY.map((m, i) => [fIn(D.MASTERY, i, 'text', { style: 'width:100px' }), num(D.MASTERY_XP, i)])),
        h('div', { class: 'form', style: 'margin-top:14px' }, lab('하루 기력', num(D.SET, 'stamina')))),
    ],
  };
  function adminConfig() {
    if (!cfgDraft) cfgDraft = structuredClone(CFG);
    return [
      h('div', { class: 'subtabs' }, CFG_TABS.map(([k, l]) => h('button', { class: cfgTab === k ? 'on' : '', onclick: () => { cfgTab = k; render(); } }, l))),
      CFG_EDITORS[cfgTab](cfgDraft),
      h('div', { class: 'savebar' },
        h('span', { class: 'mut' }, '저장하면 모든 인물에게 바로 적용됩니다'),
        h('span', { class: 'row' },
          h('button', { class: 'btn ghost', onclick: () => { cfgDraft = structuredClone(DEFAULTS); toast('기본값을 불러왔습니다. 저장해야 적용됩니다'); render(); } }, '기본값'),
          h('button', { class: 'btn ghost', onclick: () => { cfgDraft = null; toast('바꾼 내용을 되돌렸습니다'); render(); } }, '되돌리기'),
          h('button', { class: 'btn fill', onclick: act(saveCfg) }, '저장'))),
    ];
  }
  async function saveCfg() {
    const D = cfgDraft;
    // 등급 이름을 바꾸면 병기 목록의 등급도 따라 바꾼다 (이미 나온 병기는 다음 저장 때 주인 쪽에서 맞춰진다)
    GRADES.forEach((g, i) => {
      const n = D.GRADES[i]?.name;
      if (n && n !== g.name) D.ARMS_LIST.forEach(a => { if (a.grade === g.name) a.grade = n; });
    });
    Object.keys(CFG).forEach(k => replaceIn(CFG[k], D[k]));
    await saveSettings();
    cfgDraft = null; toast('설정을 저장했습니다'); render();
  }

  const PAGES = { timeline: pTimeline, thread: pThread, train: pTrain, duel: pDuel, life: pLife, letters: pLetters, people: pPeople, profile: pProfile, admin: pAdmin };

  // 폐관이 끝나는 순간 한 번만 화면을 다시 그려 출관 버튼을 연다
  const clockDone = new Set();
  function tickClock() {
    document.querySelectorAll('[data-until]').forEach(el => {
      const s = Math.max(0, Math.floor((+el.dataset.until - Date.now()) / 1000));
      el.textContent = s ? `${Math.floor(s / 3600)}:${pad(Math.floor(s % 3600 / 60))}:${pad(s % 60)}` : '폐관 완료';
      if (!s && !clockDone.has(el.dataset.until) && !typing()) { clockDone.add(el.dataset.until); render(); }
    });
  }

  boot();
})();
</script>
</body>
</html>
